x-extraction-settings: &extraction-settings
  ENRICHMENT_ENABLED: ${ENRICHMENT_ENABLED:-false}
  ENRICHMENT_OCR_CONFIGURATION: ${ENRICHMENT_OCR_CONFIGURATION:-}
  ENRICHMENT_MAX_CONCURRENT_GLOBAL: ${ENRICHMENT_MAX_CONCURRENT_GLOBAL:-1}
  EXTRACTION_ENABLED: ${EXTRACTION_ENABLED:-true}
  EXTRACTION_EXTERNAL_ENABLED: ${EXTRACTION_EXTERNAL_ENABLED:-false}
  EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-6-luna}
  EXTRACTION_MAX_PAGES: ${EXTRACTION_MAX_PAGES:-50}
  EXTRACTION_MAX_INPUT_BYTES: ${EXTRACTION_MAX_INPUT_BYTES:-2000000}
  EXTRACTION_MAX_IMAGE_PIXELS: ${EXTRACTION_MAX_IMAGE_PIXELS:-20000000}
  EXTRACTION_MAX_DOCUMENT_BYTES: ${EXTRACTION_MAX_DOCUMENT_BYTES:-262144000}
  EXTRACTION_MAX_OUTPUT_TOKENS: ${EXTRACTION_MAX_OUTPUT_TOKENS:-1024}
  EXTRACTION_ENGINEERING_MAX_OUTPUT_TOKENS: ${EXTRACTION_ENGINEERING_MAX_OUTPUT_TOKENS:-16384}
  EXTRACTION_ENGINEERING_MAX_TOTAL_INPUT_BYTES: ${EXTRACTION_ENGINEERING_MAX_TOTAL_INPUT_BYTES:-4194304}
  EXTRACTION_ENGINEERING_MAX_TEXT_CHARS: ${EXTRACTION_ENGINEERING_MAX_TEXT_CHARS:-100000}
  EXTRACTION_ENGINEERING_MAX_UPSTREAM_BYTES: ${EXTRACTION_ENGINEERING_MAX_UPSTREAM_BYTES:-65536}
  EXTRACTION_ENGINEERING_IMAGE_DETAIL: ${EXTRACTION_ENGINEERING_IMAGE_DETAIL:-high}
  EXTRACTION_ENGINEERING_REASONING_EFFORT: ${EXTRACTION_ENGINEERING_REASONING_EFFORT:-none}
  EXTRACTION_TABLES_MAX_OUTPUT_TOKENS: ${EXTRACTION_TABLES_MAX_OUTPUT_TOKENS:-32768}
  EXTRACTION_TABLES_MAX_TOTAL_INPUT_BYTES: ${EXTRACTION_TABLES_MAX_TOTAL_INPUT_BYTES:-4194304}
  EXTRACTION_TABLES_MAX_TEXT_CHARS: ${EXTRACTION_TABLES_MAX_TEXT_CHARS:-100000}
  EXTRACTION_TABLES_MAX_UPSTREAM_BYTES: ${EXTRACTION_TABLES_MAX_UPSTREAM_BYTES:-131072}
  EXTRACTION_TABLES_IMAGE_DETAIL: ${EXTRACTION_TABLES_IMAGE_DETAIL:-high}
  EXTRACTION_TABLES_REASONING_EFFORT: ${EXTRACTION_TABLES_REASONING_EFFORT:-none}
  EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-3}
  EXTRACTION_MAX_CALLS: ${EXTRACTION_MAX_CALLS:-150}
  EXTRACTION_MAX_CONCURRENT_PER_RUN: ${EXTRACTION_MAX_CONCURRENT_PER_RUN:-2}
  EXTRACTION_MAX_CONCURRENT_GLOBAL: ${EXTRACTION_MAX_CONCURRENT_GLOBAL:-4}
  EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-60}
  EXTRACTION_LEASE_SECONDS: ${EXTRACTION_LEASE_SECONDS:-30}
  EXTRACTION_BACKOFF_SECONDS: ${EXTRACTION_BACKOFF_SECONDS:-5}
  EXTRACTION_REDISPATCH_SECONDS: ${EXTRACTION_REDISPATCH_SECONDS:-30}
  EXTRACTION_RECOVERY_INTERVAL_SECONDS: ${EXTRACTION_RECOVERY_INTERVAL_SECONDS:-15}
  EXTRACTION_PRICING_BASIS: ${EXTRACTION_PRICING_BASIS:-}
  EXTRACTION_INPUT_USD_PER_MILLION: ${EXTRACTION_INPUT_USD_PER_MILLION:-}
  EXTRACTION_OUTPUT_USD_PER_MILLION: ${EXTRACTION_OUTPUT_USD_PER_MILLION:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: powerforge
      POSTGRES_PASSWORD: powerforge
      POSTGRES_DB: powerforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerforge -d powerforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: powerforge
      MINIO_ROOT_PASSWORD: powerforge_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 4 &&
      mc alias set local http://minio:9000 powerforge powerforge_minio &&
      mc mb --ignore-existing local/powerforge"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *extraction-settings
      DATABASE_URL: postgresql+psycopg://powerforge:powerforge@postgres:5432/powerforge
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: powerforge
      S3_SECRET_KEY: powerforge_minio
      S3_BUCKET: powerforge
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_SIGNED_URL_EXPIRES_SECONDS: "900"
      MAX_UPLOAD_BYTES: "262144000"
      MAX_IMAGE_PIXELS: "600000000"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
      AI_CLASSIFICATION_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  document-worker:
    build:
      context: .
      dockerfile: services/worker.Dockerfile
      args:
        WORKER_PACKAGE: document-worker
        CELERY_APP: document_worker.celery_app
        CELERY_QUEUE: document_processing
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://powerforge:powerforge@postgres:5432/powerforge
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: powerforge
      S3_SECRET_KEY: powerforge_minio
      S3_BUCKET: powerforge
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_SIGNED_URL_EXPIRES_SECONDS: "900"
      MAX_IMAGE_PIXELS: "600000000"
      MAX_PROCESSING_PAGES: "1000"
      AI_CLASSIFICATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  extraction-worker:
    build:
      context: .
      dockerfile: services/worker.Dockerfile
      args:
        WORKER_PACKAGE: extraction-worker
        CELERY_APP: extraction_worker.celery_app
        CELERY_QUEUE: document_classification,document_extraction
    environment:
      <<: *extraction-settings
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://powerforge:powerforge@postgres:5432/powerforge
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: powerforge
      S3_SECRET_KEY: powerforge_minio
      S3_BUCKET: powerforge
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_SIGNED_URL_EXPIRES_SECONDS: "900"
      AI_CLASSIFICATION_ENABLED: "true"
      AI_PROVIDER: fake
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  source-enrichment-worker:
    build:
      context: .
      dockerfile: services/worker.Dockerfile
      args:
        WORKER_PACKAGE: extraction-worker
        CELERY_APP: extraction_worker.celery_app
        CELERY_QUEUE: source_enrichment
        INSTALL_OCR: "true"
    environment:
      <<: *extraction-settings
      ENRICHMENT_WORKER_ONLY: "true"
      AI_CLASSIFICATION_ENABLED: "false"
      EXTRACTION_EXTERNAL_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://powerforge:powerforge@postgres:5432/powerforge
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: powerforge
      S3_SECRET_KEY: powerforge_minio
      S3_BUCKET: powerforge
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  extraction-scheduler:
    build:
      context: .
      dockerfile: services/worker.Dockerfile
      args:
        WORKER_PACKAGE: extraction-worker
        CELERY_APP: extraction_worker.celery_app
    command: celery -A extraction_worker.celery_app beat --loglevel=INFO --schedule=/tmp/extraction-beat
    environment:
      <<: *extraction-settings
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://powerforge:powerforge@postgres:5432/powerforge
    depends_on:
      redis:
        condition: service_healthy

  validation-worker:
    build:
      context: .
      dockerfile: services/worker.Dockerfile
      args:
        WORKER_PACKAGE: validation-worker
        CELERY_APP: validation_worker.celery_app
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
