[project]
name = "powerforge-document-worker"
version = "0.1.0"
description = "Document processing worker. Consumes the document_processing queue."
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.1",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "powerforge-shared",
    "powerforge-document-processing",
    "powerforge-document-classification",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
