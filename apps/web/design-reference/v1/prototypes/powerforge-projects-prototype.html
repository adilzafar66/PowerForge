<script>
'use strict';
const iconPaths={plus:'<path d="M12 5v14M5 12h14"/>',pencil:'<path d="m16 4 4 4-12 12H4v-4L16 4z"/><path d="M14 6l4 4"/>',arrow:'<path d="m9 18 6-6-6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m4 12 5 5L20 6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 10a7 7 0 0 1 12-3l2 5M4 12l2 5a7 7 0 0 0 12-3"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',chevron:'<path d="m6 9 6 6 6-6"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m8 5 12 7-12 7z"/>',archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 13h4"/>',alert:'<path d="M12 3 2 21h20L12 3zM12 10v4M12 17h.01"/>'};
function icon(k,size=16){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[k]||iconPaths.arrow}</svg>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
const today='Oct 28, 2026';
let projects=[
{id:'p1',number:'100265',name:'BC Ferries FMU',client:'BC Ferries',address:'123 Richmond Rd, Victoria, BC',scope:'Only new equipment in SLD E101 (Rev 12 IFC).',description:'Power system model development and supporting engineering studies.',engineers:['A. Khan'],status:'ACTIVE',restoreStatus:null,revision:'IFC 123',created:'Oct 21, 2026',updated:'Oct 26, 2026'},
{id:'p2',number:'10005',name:'BC Ferries Upgrades',client:'BC Ferries',address:'1023 Richmond Rd',scope:'Electrical equipment upgrade studies',description:'Study of existing equipment changes.',engineers:['A. Khan'],status:'CANCELLED',restoreStatus:null,revision:'Revision IFC',created:'Oct 17, 2026',updated:'Oct 24, 2026'},
{id:'p3',number:'PR09-STACK',name:'Phase 4 close-out',client:'',address:'',scope:'Phase 4 classification close-out',description:'Pilot validation environment',engineers:[],status:'ACTIVE',restoreStatus:null,revision:'RevF',created:'Oct 11, 2026',updated:'Oct 13, 2026'},
{id:'p4',number:'PR09-STACK-4',name:'Phase 4 close-out',client:'',address:'',scope:'Processing validation',description:'',engineers:[],status:'ACTIVE',restoreStatus:null,revision:'0',created:'Oct 10, 2026',updated:'Oct 12, 2026'},
{id:'p5',number:'PR09-STACK-3',name:'Phase 4 close-out',client:'',address:'',scope:'Processing validation',description:'',engineers:[],status:'ACTIVE',restoreStatus:null,revision:'0',created:'Oct 10, 2026',updated:'Oct 12, 2026'},
{id:'p6',number:'PR09-STACK-2',name:'Phase 4 close-out',client:'',address:'',scope:'Processing validation',description:'',engineers:[],status:'ACTIVE',restoreStatus:null,revision:'0',created:'Oct 10, 2026',updated:'Oct 12, 2026'}
];
let view='list',selectedId='p1',filter='ALL',search='',drawer=false,dialog=null,dirty=false,loading=false,firstRevToggle=false,formError='',editorBaseline='',pendingView=null;
function current(){return projects.find(p=>p.id===selectedId)||projects[0]}
function activeStatus(s){return s.toLowerCase().replace(/^./,c=>c.toUpperCase())}
function badge(s){return `<span class="project-chip ${esc(s)}">${esc(activeStatus(s))}</span>`}
function revisionInfo(){return current()?.revision||null}
function showToast(s){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast" role="status">${icon('check')} ${esc(s)}</div>`;clearTimeout(window.__toast);window.__toast=setTimeout(()=>root.innerHTML='',4100)}
function crumbButton(label,code){return `<button data-nav="${code}">${esc(label)}</button>`}
function header(title,subtitle,actions='',eyebrow='WORKSPACE'){return `<section class="head"><div class="head-inner"><div class="title-line"><div><h1>${esc(title)}</h1><p class="subtitle">${esc(subtitle)}</p></div><div class="actions">${actions}</div></div></div></section>`}
function projectRows(items){return items.map(p=>`<tr tabindex="0" data-open-project="${esc(p.id)}" aria-label="Open ${esc(p.name)}"><td><span class="muted-number mono">${esc(p.number)}</span></td><td><div class="project-name">${esc(p.name)}</div><div class="small-meta">${esc(p.address||'No address specified')}</div></td><td>${esc(p.client||'—')}</td><td><span class="mono muted-number">${esc(p.revision||'—')}</span></td><td>${badge(p.status)}</td><td>${esc(p.updated)}</td><td class="actions-cell"><span class="table-chevron">${icon('arrow')}</span></td></tr>`).join('')}
function resultProjects(){return projects.filter(p=>(filter==='ALL'||p.status===filter)&&(!search||[p.number,p.name,p.client,p.address].join(' ').toLowerCase().includes(search.toLowerCase())))}
function filterPills(){return ['ALL','ACTIVE','PAUSED','CANCELLED','ARCHIVED'].map(x=>{const count=x==='ALL'?projects.length:projects.filter(p=>p.status===x).length;return `<button data-filter="${x}" class="filter-pill ${x===filter?'active':''}" aria-pressed="${x===filter}">${x==='ALL'?'All':activeStatus(x)}<span>${count}</span></button>`}).join('')}
function listView(){const items=resultProjects();return header('Projects',`${projects.length} projects in workspace`, `<button class="btn primary" data-action="new-project">${icon('plus')} New Project</button>`,'WORKSPACE / PROJECTS')+`<section class="content list-content"><div class="project-list-card"><div class="toolbar"><div class="toolbar-controls"><label class="searchbox">${icon('search')}<input id="project-search" aria-label="Search projects" placeholder="Search number, name, client, or address" value="${esc(search)}"></label><div class="filter-pills" id="project-filters">${filterPills()}</div></div><button class="btn small" data-action="refresh">${icon('refresh')} Refresh</button></div><div id="project-results">${listResults(items)}</div></div><p class="help" style="margin-top:16px">Select a project to view its overview and edit its metadata. Status filters and search update immediately in this prototype.</p></section>`}
function listResults(items){return items.length?`<table class="project-table"><thead><tr><th style="width:12%">NUMBER</th><th style="width:33%">PROJECT</th><th style="width:14%">CLIENT</th><th style="width:13%">ACTIVE REV.</th><th style="width:14%">STATUS</th><th style="width:12%">UPDATED</th><th style="width:2%"></th></tr></thead><tbody>${projectRows(items)}</tbody></table><div class="list-footer"><span>Showing ${items.length} of ${projects.length} projects</span><span>Updated locally · Sample dataset</span></div>`:`<div class="empty"><h2>No matching projects</h2><p>Try a different search or status filter.</p><button class="btn" data-action="clear-filters">Clear filters</button></div>`}
function formField({label,id,placeholder='',value='',required=false,hint='',type='text',textarea=false}){return `<div class="form-field" id="wrapper-${id}"><label for="${id}">${esc(label)} ${required?'<span class="required">*</span>':''}</label>${textarea?`<textarea id="${id}" name="${id}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input id="${id}" name="${id}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" ${required?'required':''}>`}${hint?`<small>${esc(hint)}</small>`:''}<p class="error" id="error-${id}" role="alert"></p></div>`}
function newProjectView(){return header('Create Project','Set up an engineering project. You can create its first revision now or later.',`<button class="btn quiet" data-action="cancel-create">${icon('left')} Back to Projects</button>`,'PROJECTS / NEW PROJECT')+`<section class="content form-page"><form id="create-project-form" novalidate><div class="form-layout"><div class="form-main"><article class="form-card"><div class="form-head"><h2>Project identity</h2><p>These details identify the project across the workspace.</p></div><div class="form-body"><div class="form-cols">${formField({label:'Project Number',id:'new-number',required:true,placeholder:'PF-2026-005',hint:'Project number cannot be changed after creation.'})}${formField({label:'Project Name',id:'new-name',required:true,placeholder:'Ridgeline Substation'})}</div>${formField({label:'Client / Owner',id:'new-client',placeholder:'Acme Energy LLC'})}${formField({label:'Site Address',id:'new-address',placeholder:'123 Power Line Rd, Phoenix, AZ 85001'})}</div></article><article class="form-card"><div class="form-head"><h2>Scope & description</h2><p>Helpful context for engineers and collaborators.</p></div><div class="form-body">${formField({label:'Scope Summary',id:'new-scope',textarea:true,placeholder:'One-paragraph description of the electrical scope of work'})}${formField({label:'Project Description',id:'new-description',textarea:true,placeholder:'Additional context, background, or technical notes'})}</div></article><article class="form-card"><div class="form-head"><h2>Project team</h2></div><div class="form-body">${formField({label:'Engineers',id:'new-engineers',placeholder:'J. Smith, A. Patel',hint:'Comma-separated names, matching the existing project API.'})}</div></article><article class="form-card"><div class="form-head"><h2>First revision</h2><p>Optional. A project can exist before its engineering revisions.</p></div><div class="form-body"><label class="form-check"><input id="first-revision-check" type="checkbox" ${firstRevToggle?'checked':''}><div><strong>Also create the first revision</strong><span>A revision is created as Draft and may be activated immediately.</span></div></label><div id="first-revision-fields" ${firstRevToggle?'':'hidden'} style="padding-top:19px">${formField({label:'Revision identifier',id:'new-rev-id',placeholder:'IFC 001',required:false})}${formField({label:'Revision description',id:'new-rev-description',textarea:true,placeholder:'Initial engineering model'})}<label class="form-check"><input id="new-rev-active" type="checkbox" checked><div><strong>Activate the new revision</strong><span>If unchecked, the revision is created as Draft.</span></div></label></div></div><div class="form-actions"><button type="button" class="btn" data-action="cancel-create">Cancel</button><button id="create-submit" type="submit" class="btn primary">${icon('plus')} Create Project</button></div></article></div><aside class="form-aside"><div class="tip"><h3>${icon('info')} Project creation</h3><p>The project number and name are required. Other fields can be entered later.</p><p>Creating the first revision is optional and is a separate backend operation.</p></div><div class="aside-card"><h3>What comes next?</h3><p>After creation, open the project to manage revisions, documents, and the engineering model.</p><p>Project metadata can be edited from its Overview page.</p></div></aside></div></form></section>`}
function projectSummary(p){return `<dl class="kv-grid"><dt>Project Number</dt><dd class="mono">${esc(p.number)}</dd><dt>Project Name</dt><dd>${esc(p.name)}</dd><dt>Client / Owner</dt><dd>${esc(p.client||'—')}</dd><dt>Site Address</dt><dd>${esc(p.address||'—')}</dd><dt>Scope Summary</dt><dd>${esc(p.scope||'—')}</dd><dt>Project Description</dt><dd>${esc(p.description||'—')}</dd><dt>Engineers</dt><dd>${esc(p.engineers.length?p.engineers.join(', '):'—')}</dd></dl>`}
function projectRevisions(p){
  // All values are local mock fixtures. The real app supplies these from its APIs.
  if(p.id==='p1')return [
    {id:'ifc124',identifier:'IFC 124',description:'Equipment schedule update',status:'DRAFT',updated:'Oct 27, 2026',basedOn:'IFC 123',docs:4,equipment:2,connections:1},
    {id:'ifc123',identifier:'IFC 123',description:'Data collection stage',status:'ACTIVE',updated:'Oct 26, 2026',basedOn:'IFC 122',docs:4,equipment:2,connections:1},
    {id:'ifc122',identifier:'IFC 122',description:'Preliminary electrical model',status:'SUPERSEDED',updated:'Oct 20, 2026',basedOn:null,docs:2,equipment:1,connections:0}
  ];
  return p.revision?[{id:'local-current',identifier:p.revision,description:'Current working revision',status:'ACTIVE',updated:p.updated,basedOn:null,docs:null,equipment:null,connections:null}]:[];
}
function revisionStatus(s){return `<span class="status-chip ${esc(s)}">${esc(activeStatus(s))}</span>`}
function revisionHistoryRows(rows){return rows.map(r=>`<button class="history-row" data-open-revision="${esc(r.id)}" aria-label="Open revision ${esc(r.identifier)}"><span><span class="history-name">${esc(r.identifier)} · ${esc(r.description)}</span><span class="history-meta">${r.basedOn?'Based on '+esc(r.basedOn)+' · ':''}Updated ${esc(r.updated)}</span></span><span class="history-right">${revisionStatus(r.status)}<span class="table-chevron">${icon('arrow',14)}</span></span></button>`).join('')||`<div class="card-pad"><p class="muted-paragraph">No revisions yet. Create a revision to begin engineering work.</p></div>`}
function projectOverview(){
 const p=current();if(!p)return '';
 const rows=projectRevisions(p),r=rows.find(row=>row.status==='ACTIVE')||null;
 const active=p.status==='ACTIVE',paused=p.status==='PAUSED',cancelled=p.status==='CANCELLED',archived=p.status==='ARCHIVED';
 const lifecycleActions=active?`<button class="btn small" data-lifecycle="pause">${icon('pause')} Pause</button><button class="btn small danger" data-lifecycle="cancel">Cancel</button><button class="btn small" data-lifecycle="archive">Archive</button>`:paused?`<button class="btn small" data-lifecycle="resume">${icon('play')} Resume</button><button class="btn small danger" data-lifecycle="cancel">Cancel</button><button class="btn small" data-lifecycle="archive">Archive</button>`:cancelled?`<button class="btn small" data-lifecycle="archive">Archive</button>`:`<button class="btn small" data-lifecycle="unarchive">Unarchive</button>`;
 const actions=`<button class="btn" data-action="open-revisions">View revisions</button>${r?`<button class="btn primary" data-action="open-active-revision">${icon('arrow')} Open active revision</button>`:''}`;
 return header(p.name,`Project ${p.number} · ${p.client||'Client not specified'}`,actions,'PROJECT / OVERVIEW')+`<section class="content unified-overview">
 <div class="page-meta" style="margin-bottom:17px">${badge(p.status)} <span class="muted mono">${esc(p.number)}</span><span class="muted">·</span><span class="muted">Updated ${esc(p.updated)}</span></div>
 ${cancelled||archived?`<div class="readonly-warning">${icon('alert')} This ${archived?'archived':'cancelled'} project is read-only. ${archived?'Unarchive it to restore its previous status.':'Its metadata cannot be changed.'}</div>`:''}
 <section class="overview-block" aria-label="Project details"><h2 class="overview-section-heading">Project details</h2>
   <div class="overview-columns">
    <article class="card"><header class="card-top"><div><h2>Project Information</h2><p>Client, location, technical scope and engineers</p></div>${!(cancelled||archived)?`<button class="btn small" data-action="edit-project">${icon('pencil')} Edit details</button>`:''}</header><div class="card-pad">${projectSummary(p)}</div></article>
    <aside class="overview-aside">
      <article class="rail-panel project-status-panel"><h2>Project lifecycle</h2><p>Status: ${badge(p.status)}</p><p>Changing the status is separate from editing project details.</p><div class="lifecycle">${lifecycleActions}</div></article>
      <article class="rail-panel"><h2>Project summary</h2><dl class="project-summary-grid"><dt>Project number</dt><dd class="mono">${esc(p.number)}</dd><dt>Revision count</dt><dd>${rows.length}</dd><dt>Last updated</dt><dd>${esc(p.updated)}</dd></dl></article>
    </aside>
   </div>
 </section>
 <section class="overview-block" aria-label="Revision activity"><h2 class="overview-section-heading">Revision activity</h2>
   <div class="overview-columns">
    <div class="stack">
      <article class="card revision-work-card"><div class="revision-work-head"><div><span class="overline">CURRENT WORK</span><h2>${r?'Continue with '+esc(r.identifier):'No active revision'}</h2><p>${r?`${esc(r.description)} · Ready for document review and engineering model work.`:'Create or activate a revision to begin engineering work.'}</p></div>${r?revisionStatus(r.status):''}</div>
      <div class="revision-stats"><div class="revision-stat"><strong>${r?.docs??'—'}</strong><small>Documents</small></div><div class="revision-stat"><strong>${r?.equipment??'—'}</strong><small>Equipment</small></div><div class="revision-stat"><strong>${r?.connections??'—'}</strong><small>Connections</small></div><button class="btn primary" data-action="${r?'open-revision-workspace':'open-revisions'}">${r?'Open workspace':'Manage revisions'} ${icon('arrow',13)}</button></div></article>
      <article class="card revision-history-card"><header class="card-top"><div><h2>Revision history</h2><p>Recent revisions for this project</p></div><button class="btn small" data-action="open-revisions">All revisions ${icon('arrow',13)}</button></header>${revisionHistoryRows(rows)}</article>
    </div>
    <aside class="overview-aside"><article class="rail-panel"><span class="overline">ACTIVE REVISION</span>${r?`<div class="revision-side-name mono">${esc(r.identifier)}</div>${revisionStatus(r.status)}<p class="muted-paragraph">${esc(r.description)}</p><div class="rail-meta-row"><span>Updated</span><strong>${esc(r.updated)}</strong></div><div style="margin-top:17px"><button class="btn small" data-action="open-active-revision">View revision details ${icon('arrow',13)}</button></div>`:`<p class="muted-paragraph">There is no active revision.</p><button class="btn small" data-action="open-revisions">View revisions ${icon('arrow',13)}</button>`}</article></aside>
   </div>
 </section>
 <p class="help">All counts and revision details here are illustrative. Production values and lifecycle rules come from PowerForge APIs.</p>
 </section>`;
}
function formValues(prefix){return {name:document.getElementById(prefix+'-name')?.value.trim()||'',number:document.getElementById(prefix+'-number')?.value.trim()||'',client:document.getElementById(prefix+'-client')?.value.trim()||'',address:document.getElementById(prefix+'-address')?.value.trim()||'',scope:document.getElementById(prefix+'-scope')?.value.trim()||'',description:document.getElementById(prefix+'-description')?.value.trim()||'',engineers:(document.getElementById(prefix+'-engineers')?.value||'').split(',').map(x=>x.trim()).filter(Boolean)};}
function validateForm(v,mode){const errors={};if(!v.name)errors[(mode==='create'?'new':'edit')+'-name']='Project name is required.';if(mode==='create'){if(!v.number)errors['new-number']='Project number is required.';else if(projects.some(p=>p.number.toLowerCase()===v.number.toLowerCase()))errors['new-number']='Project number already exists.';if(document.getElementById('first-revision-check')?.checked&&!document.getElementById('new-rev-id')?.value.trim())errors['new-rev-id']='A revision identifier is required if creating a first revision.';}return errors;}
function showErrors(errors){document.querySelectorAll('.form-field').forEach(e=>e.classList.remove('invalid'));document.querySelectorAll('.form-field .error').forEach(e=>e.textContent='');for(const [k,msg] of Object.entries(errors)){const el=document.getElementById('error-'+k);if(el){el.textContent=msg;el.closest('.form-field').classList.add('invalid')}}const first=document.getElementById(Object.keys(errors)[0]);if(first)first.focus();}
function loadStage(){return '<section class="content view-loader"><div class="skeleton narrow"></div><div class="skeleton half"></div><div class="skeleton wide"></div><div class="skeleton wide"></div><div class="skeleton wide"></div></section>'}
function render(){document.getElementById('nav-projects').classList.toggle('active',view==='list');document.getElementById('nav-overview').classList.toggle('active',view==='overview');const c=current();document.getElementById('side-revision-label').textContent=c.revision||'No active revision';document.getElementById('side-revision-status').textContent=c.revision?'Active revision':'Revision not set';const bc=document.getElementById('breadcrumbs');bc.innerHTML=view==='list'?`<strong>Projects</strong>`:view==='create'?`${crumbButton('Projects','list')}<span class="sep">/</span><strong>New Project</strong>`:`${crumbButton('Projects','list')}<span class="sep">/</span><strong>${esc(c.name)}</strong>`;document.getElementById('top-status').style.display=view==='list'||view==='create'?'none':'';document.getElementById('top-status').textContent=activeStatus(c.status)+' project';const stage=document.getElementById('stage');stage.innerHTML=loading?loadStage():view==='list'?listView():view==='create'?newProjectView():projectOverview();}
function startView(next){if(view==='create'&&formDirty()){pendingView=next;confirmDiscard();return}view=next;pendingView=null;render();location.hash=next==='overview'?'project/'+selectedId:next;}
function formDirty(){if(view!=='create')return false;const form=document.getElementById('create-project-form');if(!form)return false;return [...form.querySelectorAll('input,textarea')].some(x=>x.type==='checkbox'?x.checked:x.value.trim()!=='')}
function showDialog(title,body,action,label='Continue',danger=false){dialog={title,body,action};document.getElementById('dialog-root').innerHTML=`<div class="dialog-wrap" id="dialog-backdrop"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-heading"><div class="eyebrow">CONFIRM ACTION</div><h2 id="dialog-heading">${esc(title)}</h2><p>${esc(body)}</p><div class="dialog-actions"><button class="btn" data-action="close-dialog">Keep working</button><button class="btn ${danger?'danger':'primary'}" data-action="confirm-dialog">${esc(label)}</button></div></section></div>`;document.querySelector('[data-action="close-dialog"]').focus()}
function confirmDiscard(){showDialog('Discard project draft?','Changes you entered in this project form will be lost.','discard-create','Discard changes',true)}
function closeDialog(){document.getElementById('dialog-root').innerHTML='';dialog=null}
function createProject(e){e.preventDefault();const v=formValues('new');const errors=validateForm(v,'create');showErrors(errors);if(Object.keys(errors).length)return;const createFirst=!!document.getElementById('first-revision-check').checked;const id='local-'+(projects.length+1);const p={id,number:v.number,name:v.name,client:v.client,address:v.address,scope:v.scope,description:v.description,engineers:v.engineers,status:'ACTIVE',restoreStatus:null,revision:createFirst?document.getElementById('new-rev-active').checked?document.getElementById('new-rev-id').value.trim():null:null,created:today,updated:today};const revId=createFirst?document.getElementById('new-rev-id').value.trim():null;const revDesc=createFirst?document.getElementById('new-rev-description').value.trim():null;const activated=createFirst?document.getElementById('new-rev-active').checked:false;const btn=document.getElementById('create-submit');btn.disabled=true;btn.innerHTML=icon('refresh')+' Creating…';setTimeout(()=>{projects.unshift(p);selectedId=id;search='';filter='ALL';view='overview';render();location.hash='project/'+id;showToast(createFirst?`Project created with ${revId} as ${activated?'Active':'Draft'} revision (simulated).`:'Project created (simulated).');},620)}
function openEdit(){const p=current();if(['CANCELLED','ARCHIVED'].includes(p.status)){showToast('Project is read-only in this status.');return}drawer=true;const node=`<div class="overlay" id="drawer-overlay"><section class="drawer drawer-compact" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-head"><div><h2 id="drawer-title">Edit Project</h2><p>${esc(p.number)} · ${esc(p.name)}</p></div><button class="btn small" data-action="close-drawer">${icon('close')} Close</button></header><div class="drawer-content"><form id="edit-project-form" class="drawer-form" novalidate><div class="notice"><strong>Project number ${esc(p.number)} is fixed.</strong><br>Edit the project information below. Status and revisions are managed separately.</div>${formField({label:'Project Name',id:'edit-name',value:p.name,required:true})}${formField({label:'Client / Owner',id:'edit-client',value:p.client})}${formField({label:'Site Address',id:'edit-address',value:p.address})}${formField({label:'Scope Summary',id:'edit-scope',value:p.scope,textarea:true})}${formField({label:'Project Description',id:'edit-description',value:p.description,textarea:true})}${formField({label:'Engineers',id:'edit-engineers',value:p.engineers.join(', '),hint:'Comma-separated engineer names'})}</form></div><div class="drawer-foot"><button class="btn" data-action="close-drawer">Cancel</button><button class="btn primary" type="submit" form="edit-project-form" id="save-project" disabled>${icon('check')} Save changes</button></div></section></div>`;document.getElementById('drawer-root').innerHTML=node;editorBaseline=editSnapshot();document.getElementById('edit-name').focus();}
function editSnapshot(){const form=document.getElementById('edit-project-form');return form?JSON.stringify([...form.querySelectorAll('input,textarea')].map(x=>[x.id,x.value])):''}
function updateEditState(){const save=document.getElementById('save-project');if(save)save.disabled=editorBaseline===editSnapshot()}
function closeDrawer(force=false){if(!drawer)return;if(!force&&editorBaseline!==editSnapshot()){showDialog('Discard unsaved changes?','Closing the editor will lose changes to project information.','discard-edit','Discard changes',true);return;}drawer=false;editorBaseline='';document.getElementById('drawer-root').innerHTML='';}
function saveProject(e){e.preventDefault();const p=current();if(['CANCELLED','ARCHIVED'].includes(p.status)){showToast('This project is read-only.');return}const v=formValues('edit'),errors=validateForm(v,'edit');showErrors(errors);if(Object.keys(errors).length)return;const save=document.getElementById('save-project');save.disabled=true;save.innerHTML=icon('refresh')+' Saving…';setTimeout(()=>{Object.assign(p,{name:v.name,client:v.client,address:v.address,scope:v.scope,description:v.description,engineers:v.engineers,updated:today});closeDrawer(true);render();showToast('Project information saved locally.');},500)}
function lifecycle(action){const p=current();const map={pause:['Pause project?','This will prevent edits until resumed.','Pause project'],resume:['Resume project?','The project will return to Active.','Resume project'],cancel:['Cancel project?','This makes the project read-only. Cancellation is not reversible using the existing lifecycle API.','Cancel project'],archive:['Archive project?','Project workspaces become read-only until unarchived.','Archive project'],unarchive:['Unarchive project?','The project will return to its status before archiving.','Unarchive project']};if(!map[action])return;dialog={action:'lifecycle',kind:action};showDialog(map[action][0],map[action][1],'lifecycle',map[action][2],['cancel','archive'].includes(action));dialog.kind=action;}
function doLifecycle(action){const p=current();const before=p.status;const valid={pause:['ACTIVE'],resume:['PAUSED'],cancel:['ACTIVE','PAUSED'],archive:['ACTIVE','PAUSED','CANCELLED'],unarchive:['ARCHIVED']};if(!valid[action]?.includes(before)){showToast('This status transition is not available.');return}if(action==='archive'){p.restoreStatus=before;p.status='ARCHIVED'}else if(action==='unarchive'){p.status=p.restoreStatus||'ACTIVE';p.restoreStatus=null}else p.status={pause:'PAUSED',resume:'ACTIVE',cancel:'CANCELLED'}[action];p.updated=today;closeDialog();render();showToast(`Project is now ${activeStatus(p.status)} (simulated).`)}
function closeMenu(){const menu=document.getElementById('revision-menu');if(menu)menu.innerHTML='';document.getElementById('revision-chevron').setAttribute('aria-expanded','false')}
function switchMenu(){const menu=document.getElementById('revision-menu');if(menu.innerHTML){closeMenu();return}menu.innerHTML=`<div class="rev-menu"><div class="tiny-title">PROJECT REVISION</div><button data-action="revision-sibling">${esc(current().revision||'No active revision')} ${icon('arrow')}</button><button data-action="revisions-sibling">Manage revisions ${icon('arrow')}</button></div>`;document.getElementById('revision-chevron').setAttribute('aria-expanded','true')}
function sibling(){location.href='powerforge-project-revisions-prototype.html#revisions'}
function openRevisionDetail(id){if(id==='local-current'){showToast('Revision detail is illustrated for BC Ferries FMU.');return;}location.href='powerforge-project-revisions-prototype.html#revision/'+encodeURIComponent(id)}
function refresh(){loading=true;render();setTimeout(()=>{loading=false;render();showToast('Projects refreshed from sample data.');},650)}
// Keep list filters/search local and interactive while avoiding full screen recreation on every keystroke.
function updateList(){const results=document.getElementById('project-results');if(results)results.innerHTML=listResults(resultProjects());const f=document.getElementById('project-filters');if(f)f.innerHTML=filterPills()}
document.addEventListener('input',e=>{if(e.target.id==='project-search'){search=e.target.value;updateList()}if(e.target.closest('#edit-project-form')){updateEditState();const er=document.getElementById('error-'+e.target.id);if(er)er.textContent='';}if(e.target.closest('#create-project-form')){const er=document.getElementById('error-'+e.target.id);if(er)er.textContent='';}});
document.addEventListener('submit',e=>{if(e.target.id==='create-project-form')createProject(e);if(e.target.id==='edit-project-form')saveProject(e)});
document.addEventListener('change',e=>{if(e.target.id==='first-revision-check'){firstRevToggle=e.target.checked;document.getElementById('first-revision-fields').hidden=!firstRevToggle;}if(e.target.closest('#edit-project-form'))updateEditState();});
document.addEventListener('click',e=>{const el=e.target.closest('[data-filter],[data-open-project],[data-open-revision],[data-lifecycle],[data-nav],[data-action]');if(!el){if(e.target.id==='drawer-overlay')closeDrawer();if(e.target.classList.contains('dialog-wrap'))closeDialog();return}if(el.dataset.filter){filter=el.dataset.filter;updateList();return}if(el.dataset.openRevision){openRevisionDetail(el.dataset.openRevision);return}if(el.dataset.openProject){selectedId=el.dataset.openProject;startView('overview');return}if(el.dataset.lifecycle){lifecycle(el.dataset.lifecycle);return}if(el.dataset.nav){startView(el.dataset.nav);return}const ac=el.dataset.action;if(!ac)return;switch(ac){case 'projects':startView('list');break;case 'new-project':startView('create');break;case 'cancel-create':startView('list');break;case 'clear-filters':search='';filter='ALL';render();break;case 'refresh':refresh();break;case 'edit-project':openEdit();break;case 'close-drawer':closeDrawer();break;case 'close-dialog':closeDialog();break;case 'confirm-dialog':{const d=dialog;if(!d)return;if(d.action==='discard-create'){closeDialog();firstRevToggle=false;view=pendingView||'list';pendingView=null;render();}else if(d.action==='discard-edit'){closeDialog();closeDrawer(true);}else if(d.action==='lifecycle')doLifecycle(d.kind);break;}case 'open-revisions':case 'revisions-sibling':sibling();break;case 'revision-sibling':case 'open-active-revision':{const r=projectRevisions(current()).find(r=>r.status==='ACTIVE');if(r)openRevisionDetail(r.id);else sibling();break;}case 'open-revision-workspace':location.href='powerforge-documents-prototype.html';break;case 'status':showToast('System Status is a separate workspace in PowerForge.');break;case 'documents':location.href='powerforge-documents-prototype.html';break;case 'model':case 'equipment':case 'topology':case 'extraction':location.href=(ac==='extraction'?'powerforge-document-evidence-prototype.html':'powerforge-equipment-prototype.html');break;}}
);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dialog)closeDialog();else if(drawer)closeDrawer();else closeMenu();}if(e.key==='Enter'&&e.target.matches('tr[data-open-project]')){selectedId=e.target.dataset.openProject;startView('overview');}});
document.getElementById('revision-label').addEventListener('click',()=>{const r=projectRevisions(current()).find(x=>x.status==='ACTIVE');if(r)openRevisionDetail(r.id);else sibling()});
document.getElementById('revision-chevron').addEventListener('click',switchMenu);
document.addEventListener('click',e=>{if(!e.target.closest('.rev-container'))closeMenu()});
document.getElementById('nav-overview').setAttribute('data-nav','overview');document.getElementById('nav-overview').removeAttribute('data-view');document.getElementById('nav-revisions').setAttribute('data-action','revisions-sibling');document.getElementById('nav-revisions').removeAttribute('data-view');
window.addEventListener('popstate',()=>{const p=location.hash.slice(1);if(p==='list'||p==='create')view=p;else if(p.startsWith('project/')){view='overview';selectedId=p.split('/')[1]||'p1';}render()});
const initial=location.hash.slice(1);if(initial==='create')view='create';else if(initial.startsWith('project/')){view='overview';selectedId=initial.split('/')[1]||'p1';}render();

       if(e.key==='Home')moveCursor(0);else if(e.key==='End')moveCursor(select.options.length-1);else moveCursor((obj.active+(e.key==='ArrowDown'?1:-1)+select.options.length)%select.options.length,e.key==='ArrowDown'?1:-1);return;
     }
