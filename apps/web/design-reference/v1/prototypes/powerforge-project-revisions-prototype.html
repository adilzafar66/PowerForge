<style id="powerforge-controls-styles">
/* PowerForge UX-9.1 — custom selection control specimens. Native input state is preserved. */
.pf-select-host{position:relative;display:inline-block;vertical-align:middle;min-width:0;max-width:100%;width:100%;flex-shrink:1}
.pf-select-native{display:none!important}
.pf-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--pf-border,#DBE3EA);border-radius:8px;background:var(--pf-surface,#fff);color:var(--pf-text-primary,#182638);font:inherit;font-size:12px;font-weight:600;line-height:1.4;text-align:left;box-shadow:0 1px 1px rgba(24,38,56,.025);cursor:pointer;transition:border-color 150ms,background-color 150ms,box-shadow 150ms}
.pf-select-trigger:hover:not(:disabled){border-color:#AFC1D0;background:#FBFCFD}
.pf-select-trigger[aria-expanded="true"]{border-color:var(--pf-action,#24557A);box-shadow:0 0 0 3px rgba(36,85,122,.10)}
.pf-select-trigger:focus-visible{outline:3px solid var(--pf-ring,#4F86AF);outline-offset:2px}
.pf-select-trigger:disabled{opacity:.55;cursor:not-allowed;background:var(--pf-soft,#F0F3F6)}
.pf-select-value{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pf-select-chevron{width:15px;height:15px;flex:none;transition:transform 160ms;color:var(--pf-text-secondary,#526477)}
.pf-select-trigger[aria-expanded="true"] .pf-select-chevron{transform:rotate(180deg)}
.pf-select-menu{position:fixed;z-index:10020;min-width:100px;max-height:min(288px,60vh);overflow:auto;padding:5px;list-style:none;margin:0;border:1px solid #CEDAE4;border-radius:10px;background:var(--pf-surface,#fff);box-shadow:0 14px 36px rgba(24,38,56,.14),0 2px 8px rgba(24,38,56,.07);animation:pf-select-in 150ms ease-out;overscroll-behavior:contain}
.pf-select-option{padding:9px 32px 9px 11px;border-radius:6px;min-height:36px;display:flex;align-items:center;position:relative;white-space:normal;font-size:12px;font-weight:550;color:var(--pf-text-primary,#182638);cursor:pointer;transition:background-color 150ms ease,color 150ms ease}
/* Option states: unselected hover is neutral, selected always retains blue tint. */
.pf-select-option:not([aria-disabled="true"]):not([aria-selected="true"]):is(:hover,[data-active="true"]){background:var(--pf-option-hover,#F5F8FA);color:var(--pf-text-primary,#182638)}
.pf-select-option[aria-selected="true"]{background:var(--pf-action-tint,#E6EEF4);color:var(--pf-action,#24557A);font-weight:750}
.pf-select-option[aria-selected="true"]:not([aria-disabled="true"]):hover{background:var(--pf-option-selected-hover,#D6E3ED)}
.pf-select-option[aria-selected="true"]:after{content:'✓';position:absolute;right:12px;font-size:15px;font-weight:800;color:var(--pf-action,#24557A)}
.pf-select-option[aria-disabled="true"]{color:var(--pf-text-tertiary,#8597A8);cursor:not-allowed;opacity:.6}
.pf-select-option:not([aria-selected="true"]):not([aria-disabled="true"]):active{background:#EAF1F5}
.pf-select-option[aria-selected="true"]:not([aria-disabled="true"]):active{background:#CCDDE9}
/* Retain actual native checkbox input: label clicking, focus, forms and checked/indeterminate states work. */
input[type="checkbox"]:not(.pf-no-theme){-webkit-appearance:none;appearance:none;display:inline-grid;place-content:center;flex:none;vertical-align:middle;width:18px;height:18px;margin:0;border:1.5px solid #A9BBCA;border-radius:5px;background:#fff;cursor:pointer;transition:background-color 150ms,border-color 150ms,box-shadow 150ms;position:relative}
input[type="checkbox"]:not(.pf-no-theme):hover:not(:disabled){border-color:var(--pf-action,#24557A);box-shadow:0 0 0 3px rgba(36,85,122,.07)}
input[type="checkbox"]:not(.pf-no-theme):checked,input[type="checkbox"]:not(.pf-no-theme):indeterminate{border-color:var(--pf-action,#24557A);background:var(--pf-action,#24557A)}
input[type="checkbox"]:not(.pf-no-theme):checked:after{content:'';width:9px;height:5px;border-left:2px solid white;border-bottom:2px solid white;transform:rotate(-45deg) translate(1px,-1px)}
input[type="checkbox"]:not(.pf-no-theme):indeterminate:after{content:'';width:9px;height:2px;border-radius:2px;background:white}
input[type="checkbox"]:not(.pf-no-theme):focus-visible{outline:3px solid var(--pf-ring,#4F86AF);outline-offset:3px}
input[type="checkbox"]:not(.pf-no-theme):disabled{background:#F2F5F7;border-color:#D9E1E8;cursor:not-allowed;opacity:.7}
input[type="checkbox"]:not(.pf-no-theme):disabled:checked{background:#A8B8C6;border-color:#A8B8C6}
label:has(input[type="checkbox"]:disabled){cursor:not-allowed;opacity:.65}
.pf-choice-row{display:flex;align-items:center;gap:10px;min-height:34px;padding:6px 0;font-size:12px;color:var(--pf-text-primary,#182638);cursor:pointer}
.pf-choice-row .pf-choice-description{color:var(--pf-text-secondary,#526477);font-size:11px}
.pf-choice-group{display:grid;gap:3px}
.pf-example-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.pf-control-example{min-width:0}
.pf-control-example label.pf-caption{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--pf-text-secondary,#526477)}
.pf-demo-result{margin-top:10px;color:var(--pf-text-secondary,#526477);font-size:11px}
@keyframes pf-select-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:760px){.pf-example-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.pf-select-option{transition:none}.pf-select-menu{animation:none}.pf-select-chevron,input[type="checkbox"]:not(.pf-no-theme){transition:none}}
body.manual-reduce-motion .pf-select-option{transition:none}
body.manual-reduce-motion .pf-select-menu{animation:none}
body.manual-reduce-motion .pf-select-chevron,body.manual-reduce-motion input[type="checkbox"]:not(.pf-no-theme){transition:none}

<body>
<div class="app">
<aside class="sidebar" aria-label="PowerForge navigation">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-3 8h7l-7 12 2-9H6z"/></svg><span>PowerForge</span></div>
  <div class="side-main">
    <div class="side-title">General</div>
    <button class="nav" id="nav-projects" data-action="projects" title="Projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projects</span></button>
    <div class="side-title">Project</div>
    <button class="nav" id="nav-overview" data-view="overview" title="Project Overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Overview</span></button>
    <button class="nav" id="nav-revisions" data-view="revisions" title="Revisions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="6" cy="4" r="2"/><circle cx="6" cy="20" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 6v12M6 12h8a4 4 0 0 0 4-4"/></svg><span>Revisions</span></button>

    <div class="rev-container"><div class="rev-selector"><button id="revision-label" class="rev-name" title="Open selected revision overview"><strong id="side-revision-label">IFC 123</strong><span id="side-revision-status">Active revision</span></button><button id="revision-chevron" class="rev-toggle" aria-label="Switch revision" aria-expanded="false" title="Switch revision"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 9 6 6 6-6"/></svg></button></div><div id="revision-menu"></div></div>
    <button class="nav" id="nav-documents" data-action="documents" title="Documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="7" y="3" width="14" height="17" rx="2"/><path d="M5 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12"/></svg><span>Documents</span></button>
    <button class="nav" id="nav-model" data-action="model" title="Engineering Model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg><span>Engineering Model</span></button>
    <div class="nav-group"><button class="subnav" id="nav-equipment" data-action="equipment">Equipment</button><button class="subnav" id="nav-topology" data-action="topology">Topology</button></div>
    <button class="nav" id="nav-extraction" data-action="extraction" title="Extraction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/><circle cx="11" cy="11" r="3"/><path d="m13.4 13.4 3 3"/></svg><span>Extraction</span></button>
  </div>
  <div class="side-foot"><button class="nav" id="nav-status" data-action="status" title="System Status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M6 13h3l2-4 3 7 2-3h2"/></svg><span>System Status</span></button></div>
</aside>
<div class="main"><div class="topbar"><div class="crumbs" id="breadcrumbs"></div><div class="top-right"><span class="hint">Prototype · illustrative data</span><span id="top-status" class="status project">Active project</span></div></div><div id="stage"></div><div class="demo-bar">Local interaction prototype · Sample revisions and counts are illustrative · No PowerForge API calls or persistent changes</div></div>
</div>
<div id="drawer-root"></div><div id="dialog-root"></div><div id="toast-root" aria-live="polite"></div>
<script>
'use strict';
const icons={edit:'<path d="M12 20h9"/><path d="m16 4 4 4-12 12H4v-4L16 4z"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m9 18 6-6-6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m4 12 5 5L20 6"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',files:'<rect x="7" y="3" width="14" height="17" rx="2"/><path d="M5 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12"/>',cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/>',branch:'<circle cx="6" cy="4" r="2"/><circle cx="6" cy="20" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 6v12M6 12h8a4 4 0 0 0 4-4"/>',edit:'<path d="m16 4 4 4-12 12H4v-4L16 4z"/>',loader:'<circle cx="12" cy="12" r="9"/>'};
function icon(k,size=16){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]||icons.arrow}</svg>`}
const project={number:'100265',name:'BC Ferries FMU',client:'BC Ferries',address:'123 Richmond Rd, Victoria, BC',scope:'Only new equipment in SLD E101 (Rev 12 IFC).',description:'Power system model development and supporting engineering studies.',engineers:['A. Khan'],status:'ACTIVE',updated:'Oct 26, 2026'};
let revisions=[{id:'ifc123',identifier:'IFC 123',description:'Data collection stage',status:'ACTIVE',created:'Oct 26, 2026',updated:'Oct 26, 2026',order:3,basedOn:'IFC 122',carryDocs:true,carryModel:true,docs:4,equipment:2,connections:1},{id:'ifc124',identifier:'IFC 124',description:'Equipment schedule update',status:'DRAFT',created:'Oct 27, 2026',updated:'Oct 27, 2026',order:4,basedOn:'IFC 123',carryDocs:true,carryModel:true,docs:4,equipment:2,connections:1},{id:'ifc122',identifier:'IFC 122',description:'Preliminary electrical model',status:'SUPERSEDED',created:'Oct 18, 2026',updated:'Oct 20, 2026',order:2,basedOn:null,carryDocs:false,carryModel:false,docs:2,equipment:1,connections:0}];
revisions=revisions.map(r=>({...r,systemFrequency:r.systemFrequency??null,systemPhaseCount:r.systemPhaseCount??null}));
let editRevisionOriginal=null;
let currentRevision='ifc123', view='revisions', filter='all', search='', drawer=false, dialog=null, busy=false, toastTimer=null;
const rev=()=>revisions.find(r=>r.id===currentRevision)||revisions.find(r=>r.status==='ACTIVE')||revisions[0];const active=()=>revisions.find(r=>r.status==='ACTIVE');
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function label(r){return `<span class="status ${r.status.toLowerCase()}">${r.status==='ACTIVE'?'Active':r.status==='DRAFT'?'Draft':'Superseded'}</span>`}
function B(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}
function header(kicker,title,description,buttons=''){return `<div class="head"><div class="head-inner"><div class="title-line"><div><h1>${title}</h1><p class="subtitle">${description}</p></div><div class="actions">${buttons}</div></div></div></div>`}
function cardTitle(title,sub='',action=''){return `<div class="card-top"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
function highlightTag(r){return `<span class="mono" style="font-weight:750">${esc(r.identifier)}</span>`}
function revisionsPreview(limit=3){return revisions.slice().sort((a,b)=>b.order-a.order).slice(0,limit).map(r=>`<button class="item-row" style="width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:white;cursor:pointer" data-open-revision="${r.id}"><span><strong>${esc(r.identifier)} · ${esc(r.description||'Revision')}</strong><small>${r.basedOn?`Based on ${esc(r.basedOn)} · `:''}Updated ${esc(r.updated)}</small></span><span style="display:flex;align-items:center;gap:11px">${label(r)}<span class="right-ar">${icon('arrow',15)}</span></span></button>`).join('')}

function filterRevision(r){return (filter==='all'||r.status.toLowerCase()===filter)&&(`${r.identifier} ${r.description} ${r.status} ${r.basedOn||''}`).toLowerCase().includes(search.toLowerCase())}
function revisionsPage(){const shown=revisions.slice().sort((a,b)=>b.order-a.order).filter(filterRevision);const counts={all:revisions.length,active:revisions.filter(r=>r.status==='ACTIVE').length,draft:revisions.filter(r=>r.status==='DRAFT').length,superseded:revisions.filter(r=>r.status==='SUPERSEDED').length};return header('PROJECT / REVISIONS','Revisions',`Review and manage the revision history for ${esc(project.name)}.`,`<button class="btn primary" data-action="create-revision">${icon('plus')} New revision</button>`)+`<div class="content"><div class="card"><div class="filters"><div class="filter-left"><input id="revision-search" class="input search" aria-label="Search revisions" placeholder="Search revisions…" value="${esc(search)}"><div class="tabs" role="group" aria-label="Filter revision status">${Object.entries(counts).map(([key,c])=>`<button data-filter="${key}" class="${filter===key?'active':''}">${key[0].toUpperCase()+key.slice(1)} ${c}</button>`).join('')}</div></div><span class="muted" style="font-size:11px">Select a revision to open details</span></div><div class="table-scroll"><table class="table"><thead><tr><th>Revision</th><th>Description / lineage</th><th>Status</th><th>Updated</th></tr></thead><tbody id="revision-table-body">${revisionRows(shown)}</tbody></table></div><div class="table-footer"><span id="filter-count">Showing ${shown.length} of ${revisions.length} revisions</span><span>Newest first</span></div></div><div class="note" style="margin-top:18px"><strong>Revision lifecycle:</strong> Draft revisions may be activated if eligible. Activating a newer draft supersedes the previously active revision. Historical revisions remain available for inspection. All actions here are simulated.</div></div>`}
function revisionRows(shown){return shown.map(r=>`<tr class="selectable" tabindex="0" data-open-revision="${r.id}"><td>${highlightTag(r)}</td><td><strong>${esc(r.description||'—')}</strong><div class="lineage">${r.basedOn?'Based on '+esc(r.basedOn):'Original revision'}</div></td><td>${label(r)}</td><td style="white-space:nowrap">${esc(r.updated)}</td></tr>`).join('')||`<tr><td colspan="4" class="empty-state">No revisions match your filters.</td></tr>`}
function revisionDetail(){const r=rev();const isReadOnly=r.status==='SUPERSEDED';const newer=r.status==='DRAFT'&&(!active()||r.order>active().order);return header(`PROJECT / REVISION / ${r.status}`,`${esc(r.identifier)} ${label(r)}`,`${esc(r.description)} · ${esc(project.name)}`,`${B(`${icon('left')} All revisions`,'goto-revisions')}${newer?B(`${icon('check')} Activate revision`,'activate-current','primary'): ''}${B(`Open revision workspace ${icon('arrow')}`,'open-workspace','primary')}`)+`<div class="content"><div class="grid"><div class="stack">${isReadOnly?`<div class="callout warning draft-banner">${icon('info')}<div><strong>Historical revision — read-only</strong><span>This revision was superseded. You can inspect its documents and engineering model, but do not edit its historical snapshot.</span></div></div>`:r.status==='DRAFT'?`<div class="callout draft-banner">${icon('info')}<div><strong>Draft revision</strong><span>This revision can be developed independently. Activation is a separate, deliberate lifecycle action.</span></div></div>`:''}<article class="card card-pad"><div class="focus-actions"><div><div class="overline" style="margin-bottom:9px">REVISION SUMMARY</div><h2 style="margin:0 0 8px;font-size:22px">${esc(r.description||r.identifier)}</h2><p class="subtitle">${esc(r.identifier)} · ${esc(r.created)} · ${esc(project.number)}</p></div>${label(r)}</div><div class="hero-footer"><div class="stat"><strong>${r.docs}</strong><small>Documents</small></div><div class="stat"><strong>${r.equipment}</strong><small>Equipment</small></div><div class="stat"><strong>${r.connections}</strong><small>Connections</small></div></div></article><article class="card">${cardTitle('Revision workspaces','Move into the working areas for this revision')}<div class="card-pad" style="padding-top:8px;padding-bottom:9px"><button class="item-row" style="width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer" data-action="documents"><span class="label">${icon('files',19)} <span><strong>Documents</strong><small>Source drawings and document processing</small></span></span><span class="right-ar">${icon('arrow')}</span></button><button class="item-row" style="width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer" data-action="equipment"><span class="label">${icon('cpu',19)} <span><strong>Engineering Model</strong><small>Equipment, attributes, terminals and topology</small></span></span><span class="right-ar">${icon('arrow')}</span></button></div></article><article class="card">${cardTitle('Revision Information','Lifecycle and ancestry of the selected revision', !isReadOnly?`<button class="btn small" data-action="edit-revision" aria-label="Edit revision information">${icon('edit')} Edit</button>`:'')}<div class="card-pad revision-info-body"><dl class="detail-grid"><dt>Identifier</dt><dd class="mono">${esc(r.identifier)}</dd><dt>Status</dt><dd>${label(r)}</dd><dt>Description</dt><dd>${esc(r.description||"—")}</dd><dt>System frequency</dt><dd>${r.systemFrequency?`${esc(r.systemFrequency)} Hz`:"Not set"}</dd><dt>System phase count</dt><dd>${r.systemPhaseCount?`${esc(r.systemPhaseCount)} phase`:"Not set"}</dd><dt>Based on</dt><dd>${r.basedOn?`<button class="inline-link" data-switch-tag="${esc(r.basedOn)}">${esc(r.basedOn)} ${icon('arrow',12)}</button>`:'—'}</dd><dt>Created</dt><dd>${esc(r.created)}</dd><dt>Updated</dt><dd>${esc(r.updated)}</dd></dl></div></article></div><aside class="stack"><article class="card card-pad"><div class="section-hd">Revision history</div><div class="timeline"><div class="timeline-item"><h4>${r.status==='ACTIVE'?'Currently active':r.status==='DRAFT'?'Draft created':'Superseded'}</h4><p>${esc(r.updated)}</p></div>${r.basedOn?`<div class="timeline-item"><h4>Based on ${esc(r.basedOn)}</h4><p>Inherited document and model snapshots where selected at creation.</p></div>`:''}<div class="timeline-item"><h4>Revision created</h4><p>${esc(r.created)}</p></div></div></article><article class="card card-pad"><div class="section-hd">Carry-forward history</div><div class="item-row"><span class="muted">Documents</span><strong>${r.carryDocs?'Carried forward':'Not inherited'}</strong></div><div class="item-row"><span class="muted">Engineering model</span><strong>${r.carryModel?'Carried forward':'Not inherited'}</strong></div><div class="note" style="margin-top:16px">These are illustrative revision creation choices, not an inference from any drawing.</div></article></aside></div></div>`}
function navSet(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('side-revision-label').textContent=rev().identifier;document.getElementById('side-revision-status').textContent=rev().status==='ACTIVE'?'Active revision':rev().status==='DRAFT'?'Draft revision':'Historical revision';const crumbs=[`<button data-view="overview">Projects</button>`,`<span class="sep">/</span><button data-view="overview">${esc(project.name)}</button>`];if(view==='overview')crumbs.push('<span class="sep">/</span><strong>Overview</strong>');if(view==='revisions')crumbs.push('<span class="sep">/</span><strong>Revisions</strong>');if(view==='revision')crumbs.push(`<span class="sep">/</span><button data-view="revisions">Revisions</button><span class="sep">/</span><strong>${esc(rev().identifier)}</strong>`);document.getElementById('breadcrumbs').innerHTML=crumbs.join('');}
function setView(next,id){if(next==='overview'){location.href='powerforge-projects-prototype.html#project/p1';return;}if(id)currentRevision=id;view=next;filter='all';search='';drawer=false;closeMenu();const hash=next==='revision'?`#revision/${currentRevision}`:`#${next}`;if(location.hash!==hash)history.pushState({},'',hash);render(true)}
function render(animate=false){navSet();document.getElementById('stage').innerHTML=animate?`<div id="loading-screen" class="head" style="height:190px"><div class="skeleton" style="width:165px;margin-bottom:15px"></div><div class="skeleton" style="width:310px;height:26px;margin-bottom:13px"></div><div class="skeleton" style="width:450px"></div></div>`:(view==='revisions'?revisionsPage():revisionDetail());if(animate){window.setTimeout(()=>{document.getElementById('stage').innerHTML=view==='revisions'?revisionsPage():revisionDetail();},240)}}
function closeMenu(){document.getElementById('revision-menu').innerHTML='';document.getElementById('revision-chevron').setAttribute('aria-expanded','false')}
function toggleMenu(){const el=document.getElementById('revision-menu');if(el.innerHTML){closeMenu();return}el.innerHTML=`<div class="rev-menu"><div class="tiny-title">SWITCH REVISION</div>${revisions.slice().sort((a,b)=>b.order-a.order).map(r=>`<button data-switch="${r.id}"><span><b class="mono">${esc(r.identifier)}</b><small style="display:block;color:var(--muted);margin-top:4px">${r.status==='ACTIVE'?'Active':r.status==='DRAFT'?'Draft':'Historical'}</small></span>${r.id===currentRevision?icon('check'):''}</button>`).join('')}<button data-view="revisions" style="border-top:1px solid var(--border);border-radius:0;color:var(--action);font-weight:750">All revisions ${icon('arrow',13)}</button></div>`;document.getElementById('revision-chevron').setAttribute('aria-expanded','true')}
function showToast(msg){const area=document.getElementById('toast-root');area.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>area.innerHTML='',3200)}
function openCreate(){drawer=true;const base=active()||revisions[0];document.getElementById('drawer-root').innerHTML=`<div class="overlay" id="drawer-overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="new-revision-title"><div class="drawer-head"><div><h2 id="new-revision-title">Create revision</h2><p class="subtitle">Create a new, separately versioned working snapshot.</p></div><button class="close" data-action="close-drawer" aria-label="Close revision form">×</button></div><form id="create-revision-form" class="drawer-body"><div class="field"><label for="new-identifier">Revision identifier *</label><input class="input" id="new-identifier" placeholder="e.g. IFC 125" maxlength="48" required autocomplete="off"><small>Must be unique within the project.</small></div><div class="field"><label for="new-description">Description</label><textarea id="new-description" class="input" placeholder="Summary of what changed in this revision"></textarea></div><div class="field"><label for="new-base">Based on</label><select class="input" id="new-base"><option value="">Start without a base revision</option>${revisions.slice().sort((a,b)=>b.order-a.order).map(r=>`<option value="${r.id}" ${r.id===base.id?'selected':''}>${esc(r.identifier)} · ${r.status.toLowerCase()}</option>`).join('')}</select><small>Revisions may inherit selected snapshots from the base.</small></div><div class="field" style="margin-top:17px"><label>Carry forward</label><label class="checkrow"><input id="carry-docs" type="checkbox" checked><span><strong>Documents</strong><small>Carry forward document membership from the base revision.</small></span></label><label class="checkrow"><input id="carry-model" type="checkbox" checked><span><strong>Engineering model</strong><small>Carry forward the equipment/model snapshot independently.</small></span></label></div><label class="checkrow"><input id="activate-on-create" type="checkbox"><span><strong>Activate on creation</strong><small>Supersedes the currently active revision. Leave unchecked to create a draft.</small></span></label><div class="note" style="margin-top:19px"><strong>Important:</strong> This is a local demonstration of revision creation. It does not call the PowerForge API.</div></form><div class="drawer-foot"><button class="btn" data-action="close-drawer">Cancel</button><button class="btn primary" type="submit" form="create-revision-form">${icon('plus')} Create revision</button></div></section></div>`;document.getElementById('new-identifier').focus();}
function readRevisionDraft(){const form=document.getElementById('edit-revision-form');if(!form)return null;return {identifier:document.getElementById('edit-identifier').value.trim(),description:document.getElementById('edit-description').value.trim(),systemFrequency:document.getElementById('edit-frequency').value.trim(),systemPhaseCount:document.getElementById('edit-phase').value};}
function isRevisionEditDirty(){if(!editRevisionOriginal)return false;const draft=readRevisionDraft();if(!draft)return false;return Object.keys(editRevisionOriginal).some(k=>String(editRevisionOriginal[k]??'')!==String(draft[k]??''));}
function updateRevisionEditState(){const save=document.getElementById('save-revision');if(save)save.disabled=!isRevisionEditDirty();}
function closeDrawer(force=false){if(!force&&editRevisionOriginal&&isRevisionEditDirty()){dialog='discard-revision-edit';document.getElementById('dialog-root').innerHTML=`<div class="dialog-wrap"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="discard-heading"><div class="eyebrow">UNSAVED CHANGES</div><h2 id="discard-heading">Discard revision changes?</h2><p>Your unsaved edits to the revision identifier, description, and manual electrical settings will be lost.</p><div class="dialog-actions"><button class="btn" data-action="keep-editing">Keep editing</button><button class="btn primary" data-action="discard-revision-edit">Discard changes</button></div></section></div>`;document.querySelector('[data-action="keep-editing"]').focus();return;}editRevisionOriginal=null;drawer=false;document.getElementById('drawer-root').innerHTML='';}
function openRevisionEditor(){const r=rev();if(r.status==='SUPERSEDED'){showToast('Superseded revisions are read-only in this design.');return;}const original={identifier:r.identifier,description:r.description||'',systemFrequency:r.systemFrequency||'',systemPhaseCount:r.systemPhaseCount==null?'':String(r.systemPhaseCount)};editRevisionOriginal=original;drawer=true;
document.getElementById('drawer-root').innerHTML=`<div class="overlay" id="drawer-overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="edit-revision-title"><div class="drawer-head"><div><h2 id="edit-revision-title">Edit revision</h2><p class="subtitle">Update metadata for ${esc(r.identifier)}</p></div><button class="close" data-action="close-drawer" aria-label="Close revision editor">×</button></div><form id="edit-revision-form" class="drawer-body" novalidate><div class="edit-section-title" style="border:0;padding-top:0;margin-top:0">Revision information</div><div class="field"><label for="edit-identifier">Revision identifier *</label><input class="input" type="text" id="edit-identifier" value="${esc(r.identifier)}" maxlength="128" required autocomplete="off"><small>Must be unique within the project. Changing this label does not create a new revision.</small></div><div class="field"><label for="edit-description">Description / notes</label><textarea id="edit-description" class="input" placeholder="What changed in this revision?">${esc(r.description||'')}</textarea><small>A short summary of the work, scope or design changes.</small></div><div class="edit-section-title">System-wide engineering metadata</div><div class="edit-hint"><strong>Manual fields only.</strong> Frequency and phase count are optional model-level settings. AI extraction does not populate or change them. Equipment-specific phase attributes remain separate.</div><div class="field-row"><div class="field"><label for="edit-frequency">System frequency (Hz)</label><input class="input" type="text" inputmode="decimal" id="edit-frequency" value="${esc(r.systemFrequency??'')}" placeholder="e.g. 60" autocomplete="off"><small>Positive decimal value; leave blank for unset.</small></div><div class="field"><label for="edit-phase">System phase count</label><select class="input" id="edit-phase"><option value="" ${r.systemPhaseCount==null?'selected':''}>Not set</option><option value="1" ${r.systemPhaseCount===1?'selected':''}>1 phase</option><option value="3" ${r.systemPhaseCount===3?'selected':''}>3 phases</option></select><small>Optional common assumption.</small></div></div><p class="edit-error" id="edit-error" role="alert" aria-live="polite"></p><div class="note" style="margin-top:12px"><strong>Unchanged by this edit:</strong> revision lifecycle status, creation date, source revision, and carry-forward history. Activation has its own confirmation workflow.</div><div class="note" style="margin-top:12px"><strong>Prototype:</strong> Save updates this browser session only; no backend request is made.</div></form><div class="drawer-foot"><button class="btn" data-action="close-drawer">Cancel</button><button id="save-revision" class="btn primary" type="submit" form="edit-revision-form" disabled>${icon('check')} Save changes</button></div></section></div>`;
document.getElementById('edit-identifier').focus();}
function saveRevisionEdit(e){e.preventDefault();const draft=readRevisionDraft();const r=rev();if(!draft||r.status==='SUPERSEDED')return;const error=document.getElementById('edit-error');error.textContent='';if(!draft.identifier){error.textContent='Revision identifier is required.';document.getElementById('edit-identifier').focus();return;}if(revisions.some(x=>x.id!==r.id&&x.identifier.toLowerCase()===draft.identifier.toLowerCase())){error.textContent='That revision identifier already exists in this project.';document.getElementById('edit-identifier').focus();return;}const frequency=draft.systemFrequency;if(frequency&&!(/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(frequency)&&Number.isFinite(Number(frequency))&&Number(frequency)>0)){error.textContent='System frequency must be a finite number greater than zero.';document.getElementById('edit-frequency').focus();return;}if(!['','1','3'].includes(draft.systemPhaseCount)){error.textContent='Phase count must be 1, 3 or Not set.';return;}revisions=revisions.map(x=>x.id===r.id?{...x,identifier:draft.identifier,description:draft.description||null,systemFrequency:frequency||null,systemPhaseCount:draft.systemPhaseCount?Number(draft.systemPhaseCount):null,updated:'Oct 28, 2026'}:x.basedOn===r.identifier?{...x,basedOn:draft.identifier}:x);closeDrawer(true);render();showToast('Revision information updated in the prototype.');}

function createRevision(e){e.preventDefault();const val=document.getElementById('new-identifier').value.trim();const description=document.getElementById('new-description').value.trim();const baseId=document.getElementById('new-base').value;const base=revisions.find(r=>r.id===baseId);const carryDocs=!!base&&document.getElementById('carry-docs').checked;const carryModel=!!base&&document.getElementById('carry-model').checked;const activate=document.getElementById('activate-on-create').checked;if(!val){showToast('Provide a revision identifier.');return}if(revisions.some(r=>r.identifier.toLowerCase()===val.toLowerCase())){showToast('That identifier is already used.');return}const order=Math.max(0,...revisions.map(r=>r.order))+1;const id='local'+order;const today='Oct 28, 2026';const added={id,identifier:val,description:description||'New working revision',systemFrequency:null,systemPhaseCount:null,status:activate?'ACTIVE':'DRAFT',created:today,updated:today,order,basedOn:base?.identifier||null,carryDocs,carryModel,docs:carryDocs?base.docs:0,equipment:carryModel?base.equipment:0,connections:carryModel?base.connections:0};if(activate)revisions=revisions.map(r=>r.status==='ACTIVE'?{...r,status:'SUPERSEDED'}:r);revisions.unshift(added);currentRevision=id;closeDrawer();setView('revision',id);showToast(`${val} created locally as ${added.status.toLowerCase()}.`)}
function askActivate(){const r=rev();const a=active();if(r.status!=='DRAFT'||(a&&r.order<=a.order)){showToast('Only an eligible newer draft can be activated.');return}dialog='activate';document.getElementById('dialog-root').innerHTML=`<div class="dialog-wrap"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="activate-heading"><div class="eyebrow">REVISION LIFECYCLE</div><h2 id="activate-heading">Activate ${esc(r.identifier)}?</h2><p>Activating this draft makes it the project’s active revision. ${a?`<strong>${esc(a.identifier)}</strong> will become superseded and read-only.`:''} This is a local preview and does not update PowerForge.</p><div class="dialog-actions"><button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="confirm-activate">${icon('check')} Activate revision</button></div></section></div>`;document.querySelector('[data-action="confirm-activate"]').focus()}
function closeDialog(){dialog=null;document.getElementById('dialog-root').innerHTML=''}
function confirmActivate(){const r=rev();if(r.status!=='DRAFT')return;revisions=revisions.map(x=>x.id===r.id?{...x,status:'ACTIVE',updated:'Oct 28, 2026'}:x.status==='ACTIVE'?{...x,status:'SUPERSEDED'}:x);closeDialog();render();showToast(`${r.identifier} activated locally. Previous active revision superseded.`)}
function openSibling(type){const p=type==='documents'?'powerforge-documents-prototype.html':type==='extraction'?'powerforge-document-evidence-prototype.html':'powerforge-equipment-prototype.html';showToast('Opening the related HTML prototype. Context is illustrative.');setTimeout(()=>{location.href=p;},380)}
// Delegated handlers cover view replacement and nav state changes.
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-open-revision]');if(!el)return;const id=el.dataset.openRevision;if(id){setView('revision',id);return}const tag=el.dataset.switchTag;if(tag){const found=revisions.find(r=>r.identifier===tag);if(found)setView('revision',found.id);return}const switchId=el.dataset.switch;if(switchId){setView('revision',switchId);return}const target=el.dataset.view;if(target){setView(target);return}const ac=el.dataset.action;if(!ac)return;switch(ac){case 'goto-revisions':setView('revisions');break;case 'open-active-detail':{const a=active();if(a)setView('revision',a.id);break}case 'open-active':{const a=active();if(a){currentRevision=a.id;openSibling('documents')}break}case 'open-workspace':openSibling('documents');break;case 'create-revision':openCreate();break;case 'edit-revision':openRevisionEditor();break;case 'keep-editing':closeDialog();break;case 'discard-revision-edit':closeDialog();closeDrawer(true);break;case 'close-drawer':closeDrawer();break;case 'activate-current':askActivate();break;case 'close-dialog':closeDialog();break;case 'confirm-activate':confirmActivate();break;case 'edit-project':location.href='powerforge-projects-prototype.html#project/p1';break;case 'projects':location.href='powerforge-projects-prototype.html#list';break;case 'documents':case 'model':case 'topology':case 'equipment':case 'extraction':openSibling(ac);break;case 'status':showToast('System Status will use the same app-shell foundation.');break;}}
);
document.addEventListener('change',e=>{if(e.target.closest('#edit-revision-form'))updateRevisionEditState();if(e.target.id==='new-base'){const enabled=!!e.target.value;for(const id of ['carry-docs','carry-model']){const x=document.getElementById(id);x.disabled=!enabled;if(!enabled)x.checked=false}}});
document.addEventListener('submit',e=>{if(e.target.id==='create-revision-form')createRevision(e);else if(e.target.id==='edit-revision-form')saveRevisionEdit(e)});
document.addEventListener('click',e=>{if(e.target.id==='drawer-overlay')closeDrawer();if(e.target.classList.contains('dialog-wrap'))closeDialog()});
document.getElementById('revision-label').addEventListener('click',()=>setView('revision',currentRevision));document.getElementById('revision-chevron').addEventListener('click',toggleMenu);
document.addEventListener('click',e=>{if(!e.target.closest('.rev-container'))closeMenu()});
document.addEventListener('input',e=>{if(e.target.closest('#edit-revision-form')){updateRevisionEditState();const error=document.getElementById('edit-error');if(error)error.textContent='';}if(e.target.id==='revision-search'){search=e.target.value;const shown=revisions.slice().sort((a,b)=>b.order-a.order).filter(filterRevision);const body=document.getElementById('revision-table-body');if(body)body.innerHTML=revisionRows(shown);const count=document.getElementById('filter-count');if(count)count.textContent=`Showing ${shown.length} of ${revisions.length} revisions`;}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(t=>t.classList.toggle('active',t.dataset.filter===filter));const shown=revisions.slice().sort((a,b)=>b.order-a.order).filter(filterRevision);document.getElementById('revision-table-body').innerHTML=revisionRows(shown);document.getElementById('filter-count').textContent=`Showing ${shown.length} of ${revisions.length} revisions`;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dialog)closeDialog();else if(drawer)closeDrawer();else closeMenu();}if(e.key==='Enter'){const row=e.target.closest('tr[data-open-revision]');if(row)setView('revision',row.dataset.openRevision)}});
window.addEventListener('popstate',()=>{const p=location.hash.replace(/^#/,'');if(p.startsWith('revision/')){const id=p.split('/')[1];if(revisions.some(r=>r.id===id)){view='revision';currentRevision=id}}else if(p==='overview'){location.href='powerforge-projects-prototype.html#project/p1';return;}else if(p==='revisions')view=p;render()});
const first=location.hash.replace(/^#/,'');if(first.startsWith('revision/')){const id=first.split('/')[1];if(revisions.some(r=>r.id===id)){view='revision';currentRevision=id}}else if(first==='overview'){location.replace('powerforge-projects-prototype.html#project/p1');}else if(first==='revisions')view=first;render();
</script>
<script id="powerforge-controls-script">

   trigger.addEventListener('keydown',e=>{
     if(e.key==='Tab'){close();return;}
     if(e.key==='Escape'){if(openControl===obj){e.preventDefault();e.stopPropagation();close(true);}return;}
     if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
       e.preventDefault();if(openControl!==obj)show();
       if(e.key==='Home')moveCursor(0);else if(e.key==='End')moveCursor(select.options.length-1);else moveCursor((obj.active+(e.key==='ArrowDown'?1:-1)+select.options.length)%select.options.length,e.key==='ArrowDown'?1:-1);return;
     }

     }
   });
   select.addEventListener('change',sync);select.addEventListener('input',sync);trigger.addEventListener('focus',sync);
   ownLabels.forEach(l=>l.addEventListener('click',e=>{e.preventDefault();trigger.focus();}));
   obj.close=close;
   sync();
 }
 function scan(root){if(root.nodeType!==1&&root.nodeType!==9)return;if(root.matches?.('select'))enhanced(root);root.querySelectorAll?.('select').forEach(enhanced);}
 document.addEventListener('pointerdown',e=>{if(openControl&&!openControl.host.contains(e.target)&&!openControl.list.contains(e.target))openControl.close();});
 window.addEventListener('resize',()=>{if(openControl)openControl.close();});
 window.addEventListener('scroll',e=>{if(openControl&&!openControl.list.contains(e.target))openControl.close();},true);
 const init=()=>{scan(document);let batch=false;const observer=new MutationObserver(records=>{if(batch)return;batch=true;queueMicrotask(()=>{batch=false;for(const record of records){for(const n of record.addedNodes)scan(n);}});});observer.observe(document.body,{childList:true,subtree:true});
   const mixed=document.getElementById('pf-demo-mixed');if(mixed){mixed.indeterminate=true;mixed.addEventListener('change',()=>{mixed.indeterminate=false;});}
   const choice=document.getElementById('pf-controls-choice');if(choice)choice.addEventListener('change',()=>{const t=document.getElementById('pf-controls-current');if(t)t.textContent='Selected: '+choice.options[choice.selectedIndex].text;});
 };

})();
