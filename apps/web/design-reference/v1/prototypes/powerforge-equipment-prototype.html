<style id="powerforge-controls-styles">
/* PowerForge UX-9.1 — custom selection control specimens. Native input state is preserved. */
.pf-select-host{position:relative;display:inline-block;vertical-align:middle;min-width:0;max-width:100%;width:100%;flex-shrink:1}
.pf-select-native{display:none!important}
.pf-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--pf-border,#DBE3EA);border-radius:8px;background:var(--pf-surface,#fff);color:var(--pf-text-primary,#182638);font:inherit;font-size:12px;font-weight:600;line-height:1.4;text-align:left;box-shadow:0 1px 1px rgba(24,38,56,.025);cursor:pointer;transition:border-color 150ms,background-color 150ms,box-shadow 150ms}
.pf-select-trigger:hover:not(:disabled){border-color:#AFC1D0;background:#FBFCFD}
.pf-select-trigger[aria-expanded="true"]{border-color:var(--pf-action,#24557A);box-shadow:0 0 0 3px rgba(36,85,122,.10)}
.pf-select-trigger:focus-visible{outline:3px solid var(--pf-ring,#4F86AF);outline-offset:2px}
.pf-select-trigger:disabled{opacity:.55;cursor:not-allowed;background:var(--pf-soft,#F0F3F6)}
.pf-select-value{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pf-select-chevron{width:15px;height:15px;flex:none;transition:transform 160ms;color:var(--pf-text-secondary,#526477)}
.pf-select-trigger[aria-expanded="true"] .pf-select-chevron{transform:rotate(180deg)}
.pf-select-menu{position:fixed;z-index:10020;min-width:100px;max-height:min(288px,60vh);overflow:auto;padding:5px;list-style:none;margin:0;border:1px solid #CEDAE4;border-radius:10px;background:var(--pf-surface,#fff);box-shadow:0 14px 36px rgba(24,38,56,.14),0 2px 8px rgba(24,38,56,.07);animation:pf-select-in 150ms ease-out;overscroll-behavior:contain}
.pf-select-option{padding:9px 32px 9px 11px;border-radius:6px;min-height:36px;display:flex;align-items:center;position:relative;white-space:normal;font-size:12px;font-weight:550;color:var(--pf-text-primary,#182638);cursor:pointer;transition:background-color 150ms ease,color 150ms ease}
/* Option states: unselected hover is neutral, selected always retains blue tint. */
.pf-select-option:not([aria-disabled="true"]):not([aria-selected="true"]):is(:hover,[data-active="true"]){background:var(--pf-option-hover,#F5F8FA);color:var(--pf-text-primary,#182638)}
.pf-select-option[aria-selected="true"]{background:var(--pf-action-tint,#E6EEF4);color:var(--pf-action,#24557A);font-weight:750}
.pf-select-option[aria-selected="true"]:not([aria-disabled="true"]):hover{background:var(--pf-option-selected-hover,#D6E3ED)}
.pf-select-option[aria-selected="true"]:after{content:'✓';position:absolute;right:12px;font-size:15px;font-weight:800;color:var(--pf-action,#24557A)}
.pf-select-option[aria-disabled="true"]{color:var(--pf-text-tertiary,#8597A8);cursor:not-allowed;opacity:.6}
.pf-select-option:not([aria-selected="true"]):not([aria-disabled="true"]):active{background:#EAF1F5}
.pf-select-option[aria-selected="true"]:not([aria-disabled="true"]):active{background:#CCDDE9}
/* Retain actual native checkbox input: label clicking, focus, forms and checked/indeterminate states work. */
input[type="checkbox"]:not(.pf-no-theme){-webkit-appearance:none;appearance:none;display:inline-grid;place-content:center;flex:none;vertical-align:middle;width:18px;height:18px;margin:0;border:1.5px solid #A9BBCA;border-radius:5px;background:#fff;cursor:pointer;transition:background-color 150ms,border-color 150ms,box-shadow 150ms;position:relative}
input[type="checkbox"]:not(.pf-no-theme):hover:not(:disabled){border-color:var(--pf-action,#24557A);box-shadow:0 0 0 3px rgba(36,85,122,.07)}
input[type="checkbox"]:not(.pf-no-theme):checked,input[type="checkbox"]:not(.pf-no-theme):indeterminate{border-color:var(--pf-action,#24557A);background:var(--pf-action,#24557A)}
input[type="checkbox"]:not(.pf-no-theme):checked:after{content:'';width:9px;height:5px;border-left:2px solid white;border-bottom:2px solid white;transform:rotate(-45deg) translate(1px,-1px)}
input[type="checkbox"]:not(.pf-no-theme):indeterminate:after{content:'';width:9px;height:2px;border-radius:2px;background:white}
input[type="checkbox"]:not(.pf-no-theme):focus-visible{outline:3px solid var(--pf-ring,#4F86AF);outline-offset:3px}
input[type="checkbox"]:not(.pf-no-theme):disabled{background:#F2F5F7;border-color:#D9E1E8;cursor:not-allowed;opacity:.7}
input[type="checkbox"]:not(.pf-no-theme):disabled:checked{background:#A8B8C6;border-color:#A8B8C6}
label:has(input[type="checkbox"]:disabled){cursor:not-allowed;opacity:.65}
.pf-choice-row{display:flex;align-items:center;gap:10px;min-height:34px;padding:6px 0;font-size:12px;color:var(--pf-text-primary,#182638);cursor:pointer}
.pf-choice-row .pf-choice-description{color:var(--pf-text-secondary,#526477);font-size:11px}
.pf-choice-group{display:grid;gap:3px}
.pf-example-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.pf-control-example{min-width:0}
.pf-control-example label.pf-caption{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--pf-text-secondary,#526477)}
.pf-demo-result{margin-top:10px;color:var(--pf-text-secondary,#526477);font-size:11px}
@keyframes pf-select-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:760px){.pf-example-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.pf-select-option{transition:none}.pf-select-menu{animation:none}.pf-select-chevron,input[type="checkbox"]:not(.pf-no-theme){transition:none}}
body.manual-reduce-motion .pf-select-option{transition:none}
body.manual-reduce-motion .pf-select-menu{animation:none}
body.manual-reduce-motion .pf-select-chevron,body.manual-reduce-motion input[type="checkbox"]:not(.pf-no-theme){transition:none}

</style>

<script>
const icon=(name)=>{const a={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',arrow:'<path d="M19 12H5m7-7-7 7 7 7"/>',edit:'<path d="M12 20h9M16 4l4 4-11 11-4 1 1-4L16 4z"/>',check:'<path d="m5 12 4 4L19 6"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${a[name]||''}</svg>`};
const items=[{tag:'BCH PRES',type:'Utility Source',name:'BC Hydro Present Fault',voltage:'12.47 kV',phase:'Not populated',source:'Not populated',terminal:'OUTPUT',related:'TX BCH · PRIMARY',verification:'ENGINEER_REVIEWED'},{tag:'TX BCH',type:'2-Winding Transformer',name:'BC Hydro Transformer',voltage:'12.47 kV',phase:'Not populated',source:'Not populated',terminal:'PRIMARY · SECONDARY',related:'BCH PRES · OUTPUT',verification:'UNVERIFIED'}];
let selection='BCH PRES',view=new URLSearchParams(location.search).get('view')||'quick',tab=new URLSearchParams(location.search).get('tab')||'attributes',dirty=false;
function selected(){return items.find(x=>x.tag===selection)||items[0]}
function setUrl(){let q=new URLSearchParams(location.search);q.set('view',view);if(view==='edit')q.set('tab',tab);else q.delete('tab');try{history.replaceState(null,'',location.pathname+'?'+q)}catch(e){} }
function notice(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function listHTML(){const detail=view==='quick';return `<section class="headbar"><div><div class="head-pre">Engineering Model / Equipment</div><h1>Equipment</h1><p>Manage electrical equipment in revision IFC 123</p></div><div class="head-actions"><button class="btn btn-primary" id="add">${icon('plus')}Add Equipment</button></div></section><div class="metrics"><div class="metric"><div class="metric-value">2</div><div class="metric-desc"><b>Total equipment</b> · In this revision</div></div><div class="metric"><div class="metric-value">2</div><div class="metric-desc"><b>Active</b> · Available for studies</div></div><div class="metric"><div class="metric-value">0</div><div class="metric-desc"><b>Removed</b> · Retained in history</div></div></div><div class="split"><section class="list-wrap"><div class="toolbar"><div class="search">${icon('search')}<input aria-label="Search equipment" id="search-equip" placeholder="Search tag, name, or type…"/></div><select class="control" aria-label="Filter by type" id="type-filter"><option>All types</option><option>Utility Source</option><option>2-Winding Transformer</option></select><select class="control" aria-label="Filter by status"><option>Active</option><option>All</option><option>Removed</option></select></div><div class="card"><table class="table"><thead><tr><th style="width:41%">Equipment</th><th style="width:38%">Type</th><th>Status</th></tr></thead><tbody id="eqtbody">${items.map(x=>`<tr data-equipment="${x.tag}" tabindex="0" class="${detail&&x.tag===selection?'selected':''}"><td><strong>${x.tag}</strong><span class="subcell">${x.name}</span></td><td>${x.type}</td><td><span class="status">Active</span></td></tr>`).join('')}</tbody></table><div class="footer">Showing 2 of 2 equipment · Select an item to inspect</div></div><div class="hint">Quick details stay alongside the list; use Edit to open the full workspace.</div></section>${detail?inspectorHTML():''}</div>`}
function inspectorHTML(){let x=selected();return `<aside class="inspector" aria-label="Equipment quick details"><div class="insp-header"><div><div class="eyebrow">Equipment quick details</div><h2>${x.tag}</h2><p>${x.type}</p></div><button class="iconbtn" id="close-details" aria-label="Close equipment details">${icon('close')}</button></div><div class="insp-section"><div class="section-label">Overview</div><div class="detailpair"><span>Equipment name</span><strong>${x.name}</strong></div><div class="detailpair"><span>Lifecycle</span><strong style="color:var(--green)">● Active</strong></div><div class="detailpair"><span>Revision</span><strong>IFC 123</strong></div></div><div class="insp-section"><div class="section-label">Key electrical information</div><div class="detailpair"><span>Nominal voltage</span><strong>${x.voltage}</strong></div><div class="detailpair"><span>Phase count</span><strong class="missing">${x.phase}</strong></div><div class="detailpair"><span>Source data basis</span><strong class="missing">${x.source}</strong></div></div><div class="insp-section"><div class="section-label">Topology</div><div class="inset-note"><strong style="color:var(--text)">1 active connection</strong><br/>${x.terminal} ↔ ${x.related}</div></div><div class="insp-section"><div class="section-label">Engineering provenance</div><div class="detailpair"><span>Origin</span><strong>MANUAL</strong></div><div class="detailpair"><span>Verification</span><strong>${x.verification}</strong></div></div><div class="insp-footer"><button class="btn btn-primary" id="edit-equipment">${icon('edit')}Open full editor</button></div></aside>`}
function editorHTML(){let x=selected();return `<div class="editor-header"><div class="editor-title"><button class="back" id="back-equipment">${icon('arrow')}Back to Equipment</button><h1>${x.tag} <span style="font-size:12px;vertical-align:middle;color:var(--green);font-weight:650;letter-spacing:0;margin-left:10px">● ACTIVE</span></h1><p>${x.type} · ${x.name} · IFC 123</p></div><div class="head-actions"><span class="saveind" id="save-indicator">No unsaved changes</span><button class="btn btn-primary" id="save-equipment">${icon('check')}Save changes</button></div></div><div class="editor-layout"><section class="card editor-card"><div class="tabs" role="tablist" aria-label="Equipment editor sections"><button class="tab ${tab==='general'?'active':''}" data-tab="general" role="tab" aria-selected="${tab==='general'}">General</button><button class="tab ${tab==='attributes'?'active':''}" data-tab="attributes" role="tab" aria-selected="${tab==='attributes'}">Attributes</button><button class="tab ${tab==='terminals'?'active':''}" data-tab="terminals" role="tab" aria-selected="${tab==='terminals'}">Terminals</button></div><div class="editor-body" id="editor-fields">${tab==='general'?generalHTML():tab==='terminals'?terminalsHTML():attributesHTML()}</div></section><aside><div class="aside-card"><h3>Equipment information</h3><div class="detailpair"><span>Equipment tag</span><strong>${x.tag}</strong></div><div class="detailpair"><span>Type</span><strong>${x.type}</strong></div><div class="detailpair"><span>Lifecycle</span><strong style="color:var(--green)">Active</strong></div><div class="detailpair"><span>Origin</span><strong>MANUAL</strong></div><div class="detailpair"><span>Verification</span><strong>${x.verification}</strong></div><div class="info-box"><strong>Single Save operation</strong><br/>The production editor will use the existing transactional API and warn before discarding changes.</div></div><div class="aside-card" style="margin-top:16px"><h3>Navigation</h3><p class="tiny">General, Attributes, and Terminals are edited in one workspace. Registry-driven fields remain precise and revision-scoped.</p></div></aside></div><div class="hintbar">${icon('check')} Concept only — changes in this preview are not saved to PowerForge.</div>`}
function generalHTML(){let x=selected();return `<div class="group-title"><h3>General information</h3><span class="caption">Changes saved together</span></div><div class="field-grid"><div class="field"><label>Equipment type</label><select class="textinput"><option>${x.type}</option><option>Utility Source</option><option>2-Winding Transformer</option></select><small>Changing type reconciles terminal profiles.</small></div><div class="field"><label>Equipment tag *</label><input class="textinput" value="${x.tag}"/></div><div class="field"><label>Equipment name</label><input class="textinput" value="${x.name}"/></div><div class="field"><label>Lifecycle status</label><select class="textinput"><option>Active</option><option>Removed</option></select></div></div><div class="editor-divider"></div><div class="field"><label>Description</label><textarea class="textinput" rows="4" style="height:125px;resize:vertical" placeholder="Add equipment notes or context…"></textarea></div>`}
function attributesHTML(){return `<div class="group-title"><h3>Electrical characteristics</h3><span class="caption">2 critical attributes · Registry-driven</span></div><div class="attr-header"><div>Attribute</div><div>Value</div><div>Unit</div><div>Information state</div></div><div class="attr-row"><div><div class="attr-name">Nominal Voltage <span class="pill required">Required</span><span class="pill">Critical</span></div><div class="attr-desc">Usually 24.94 kV or 12.47 kV</div></div><input aria-label="Nominal Voltage" value="12.47" inputmode="decimal"/><select aria-label="Nominal Voltage unit"><option>kV</option><option>V</option></select><select aria-label="Nominal Voltage information state"><option>Present</option><option>Not populated</option><option>Missing</option><option>Not applicable</option></select></div><div class="attr-row"><div><div class="attr-name">Phase Count <span class="pill required">Required</span><span class="pill">Critical</span></div><div class="attr-desc">Commonly 3 phases</div></div><input aria-label="Phase Count" placeholder="—" disabled/><select aria-label="Phase Count unit" disabled><option>—</option></select><select aria-label="Phase Count information state"><option>Not populated</option><option>Present</option><option>Missing</option><option>Not applicable</option></select></div><div class="attr-row"><div><div class="attr-name">Source Data Basis</div><div class="attr-desc">Source reference for fault data</div></div><input aria-label="Source Data Basis" placeholder="—" disabled/><select aria-label="Source Data Basis unit" disabled><option>—</option></select><select aria-label="Source Data Basis information state"><option>Not populated</option><option>Present</option><option>Missing</option><option>Not applicable</option></select></div><div class="attr-note"><strong>Provenance:</strong> Nominal Voltage · MANUAL · ENGINEER_REVIEWED. Other fields remain NOT_POPULATED and UNVERIFIED. Select an attribute in the eventual production UI to expand source notes, verification, and registry guidance.</div><div class="editor-divider"></div><div class="group-title"><h3>Attribute tools</h3></div><div class="field-grid"><div class="field"><label>Find an attribute</label><input class="textinput" placeholder="Search attribute name…"/></div><div class="field"><label>Show</label><select class="textinput"><option>All attributes</option><option>Required</option><option>Critical</option><option>Not populated</option></select></div></div>`}
function terminalsHTML(){return `<div class="group-title"><h3>Equipment terminals</h3><span class="caption">Profile-managed and custom</span></div><p style="font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 18px">Normal terminals are application-managed. Add a custom terminal only for exceptional roles such as Ground or Neutral.</p><div class="attr-header" style="grid-template-columns:1.2fr 1fr 1fr"><div>Terminal key</div><div>Label</div><div>Management</div></div><div class="attr-row" style="grid-template-columns:1.2fr 1fr 1fr"><strong style="font-size:12px">OUTPUT</strong><input aria-label="Terminal label" placeholder="Optional display label"/><span class="pill">Application-managed · Active</span></div><div class="editor-divider"></div><button class="btn" id="add-terminal">${icon('plus')}Add Custom Terminal</button><div class="attr-note">Connected active terminals cannot be removed by equipment-type changes. The final implementation will retain all Phase 5 terminal lifecycle safeguards.</div>`}
function render(){setUrl();document.querySelector('#crumb-last').textContent=view==='edit'?selected().tag:'Equipment';document.querySelector('#workspace').innerHTML=view==='edit'?editorHTML():listHTML();bind()}
function bind(){if(view!=='edit'){document.querySelectorAll('[data-equipment]').forEach(tr=>{const choose=()=>{selection=tr.dataset.equipment;view='quick';render()};tr.addEventListener('click',choose);tr.addEventListener('keydown',e=>{if(e.key==='Enter'){choose()}})});document.querySelector('#edit-equipment')?.addEventListener('click',()=>{view='edit';tab='attributes';render()});document.querySelector('#close-details')?.addEventListener('click',()=>{view='list';render()});document.querySelector('#search-equip')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('[data-equipment]').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')});document.querySelector('#type-filter')?.addEventListener('change',e=>{document.querySelectorAll('[data-equipment]').forEach(r=>r.style.display=e.target.value==='All types'||r.textContent.includes(e.target.value)?'':'none')});document.querySelector('#add')?.addEventListener('click',()=>notice('Prototype only — equipment creation is not connected.'));}else{document.querySelector('#back-equipment').addEventListener('click',()=>{if(dirty&&!confirm('Discard unsaved prototype changes?'))return;dirty=false;view='quick';render()});document.querySelector('#save-equipment').addEventListener('click',()=>{dirty=false;document.querySelector('#save-indicator').textContent='Preview saved locally';notice('Preview updated — no backend changes were made.');});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));document.querySelectorAll('#editor-fields input,#editor-fields select,#editor-fields textarea').forEach(e=>e.addEventListener('change',()=>{dirty=true;document.querySelector('#save-indicator').textContent='Unsaved changes'}));document.querySelector('#add-terminal')?.addEventListener('click',()=>notice('Prototype only — custom terminal action.'));}}
render();
</script>
<script id="powerforge-controls-script">
/* PowerForge UX-9.1: progressive enhancement for HTML design prototypes.
 * Native <select> remains the state/form source of truth; combobox is a themed, accessible facade.
 * Production should use a proven accessible Select primitive (e.g. Radix Select) with backend behavior unchanged.
 */
(function(){
 'use strict';
 let seed=0, openControl=null;
 const chevron='<svg aria-hidden="true" class="pf-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
 const safeText=(v)=>String(v||'').trim();
 function enhanced(select){
   if(select.dataset.pfEnhanced==='true'||select.closest('.pf-select-host'))return;
   if(select.multiple||select.size>1)return; // keep specialized controls native
   const host=document.createElement('span');host.className='pf-select-host';
   if(select.style.width){host.style.width=select.style.width;}
   else if(select.style.minWidth)host.style.minWidth=select.style.minWidth;
   if(select.classList.contains('invalid'))host.classList.add('invalid');
   select.insertAdjacentElement('beforebegin',host);host.appendChild(select);
   select.classList.add('pf-select-native');select.dataset.pfEnhanced='true';select.tabIndex=-1;select.setAttribute('aria-hidden','true');
   const trigger=document.createElement('button');trigger.type='button';trigger.className='pf-select-trigger';trigger.setAttribute('role','combobox');trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
   const label=document.createElement('span');label.className='pf-select-value';trigger.append(label);trigger.insertAdjacentHTML('beforeend',chevron);host.appendChild(trigger);
   const id='pf-listbox-'+(++seed);trigger.setAttribute('aria-controls',id);
   const described=select.getAttribute('aria-describedby');if(described)trigger.setAttribute('aria-describedby',described);
   let sourceName=select.getAttribute('aria-label')||'';
   const ownLabels=select.id?Array.from(document.querySelectorAll('label[for]')).filter(l=>l.htmlFor===select.id):[];
   if(!sourceName)sourceName=safeText(ownLabels.map(l=>l.textContent).join(' '));
   if(!sourceName){const outer=select.closest('label');if(outer)sourceName=safeText(outer.textContent);}
   if(!sourceName)sourceName='Choose an option';
   const list=document.createElement('div');list.className='pf-select-menu';list.id=id;list.setAttribute('role','listbox');list.setAttribute('aria-label',sourceName);list.hidden=true;list.style.display='none';document.body.appendChild(list);
   const obj={select,host,trigger,list,label,name:sourceName,active:0,items:[],typeBuffer:'',bufferTime:0};
   function sync(){
     const selected=select.options[select.selectedIndex];label.textContent=selected?selected.text:'Choose…';trigger.setAttribute('aria-label',sourceName+': '+(selected?selected.text:'Choose an option'));
     trigger.disabled=select.disabled;host.classList.toggle('invalid',select.classList.contains('invalid'));
     if(openControl===obj){obj.items.forEach((item,i)=>{item.setAttribute('aria-selected',String(i===select.selectedIndex));});}
   }
   function moveCursor(i,direction=1,shouldScroll=true){const opts=Array.from(select.options);if(!opts.length)return;for(let k=0;k<opts.length;k++){const idx=(i+k*direction+opts.length*2)%opts.length;if(!opts[idx].disabled){obj.active=idx;break;}}
     obj.items.forEach((el,j)=>el.dataset.active=String(j===obj.active));const opt=obj.items[obj.active];if(opt){trigger.setAttribute('aria-activedescendant',opt.id);if(shouldScroll)opt.scrollIntoView({block:'nearest'});}}
   function position(){const r=trigger.getBoundingClientRect();const width=Math.max(r.width,Math.min(280,innerWidth-24));list.style.width=width+'px';list.style.left=Math.max(8,Math.min(r.left,innerWidth-width-8))+'px';list.style.visibility='hidden';list.hidden=false;list.style.display='block';const h=list.getBoundingClientRect().height;const down=innerHeight-r.bottom-10;const placeAbove=down<Math.min(h,230)&&r.top>h+12;list.style.top=(placeAbove?Math.max(8,r.top-h-5):Math.min(innerHeight-h-8,r.bottom+5))+'px';list.style.visibility='visible';}
   function close(focus=false){if(openControl!==obj)return;openControl=null;list.hidden=true;list.style.display='none';trigger.setAttribute('aria-expanded','false');trigger.removeAttribute('aria-activedescendant');if(focus)trigger.focus();}
   function commit(index){const opt=select.options[index];if(!opt||opt.disabled)return;const changed=select.selectedIndex!==index;select.selectedIndex=index;sync();close(true);if(changed){select.dispatchEvent(new Event('input',{bubbles:true}));select.dispatchEvent(new Event('change',{bubbles:true}));}}
   function show(){if(trigger.disabled)return;if(openControl)openControl.close();list.replaceChildren();obj.items=[];for(let i=0;i<select.options.length;i++){const opt=select.options[i];const el=document.createElement('div');el.className='pf-select-option';el.id=id+'-option-'+i;el.setAttribute('role','option');el.dataset.index=i;el.setAttribute('aria-selected',String(select.selectedIndex===i));if(opt.disabled)el.setAttribute('aria-disabled','true');el.textContent=opt.text;el.addEventListener('pointerdown',e=>e.preventDefault());if(!opt.disabled)el.addEventListener('pointerenter',()=>moveCursor(i,1,false));el.addEventListener('click',()=>commit(i));list.appendChild(el);obj.items.push(el);}
     obj.active=Math.max(0,select.selectedIndex);openControl=obj;obj.close=close;trigger.setAttribute('aria-expanded','true');position();moveCursor(obj.active);trigger.focus();}
   trigger.addEventListener('click',()=>{if(openControl===obj)close();else show()});
   trigger.addEventListener('keydown',e=>{
     if(e.key==='Tab'){close();return;}
     if(e.key==='Escape'){if(openControl===obj){e.preventDefault();e.stopPropagation();close(true);}return;}
     if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
       e.preventDefault();if(openControl!==obj)show();
       if(e.key==='Home')moveCursor(0);else if(e.key==='End')moveCursor(select.options.length-1);else moveCursor((obj.active+(e.key==='ArrowDown'?1:-1)+select.options.length)%select.options.length,e.key==='ArrowDown'?1:-1);return;
     }
     if(e.key==='Enter'||e.key===' '){e.preventDefault();if(openControl===obj)commit(obj.active);else show();return;}
     if(openControl===obj&&e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
       const now=Date.now();obj.typeBuffer=now-obj.bufferTime>600?e.key.toLowerCase():obj.typeBuffer+e.key.toLowerCase();obj.bufferTime=now;
       let idx=Array.from(select.options).findIndex(x=>!x.disabled&&x.text.trim().toLowerCase().startsWith(obj.typeBuffer));if(idx>=0)moveCursor(idx);
     }
   });
   select.addEventListener('change',sync);select.addEventListener('input',sync);trigger.addEventListener('focus',sync);
   ownLabels.forEach(l=>l.addEventListener('click',e=>{e.preventDefault();trigger.focus();}));
   obj.close=close;
   sync();
 }
 function scan(root){if(root.nodeType!==1&&root.nodeType!==9)return;if(root.matches?.('select'))enhanced(root);root.querySelectorAll?.('select').forEach(enhanced);}
 document.addEventListener('pointerdown',e=>{if(openControl&&!openControl.host.contains(e.target)&&!openControl.list.contains(e.target))openControl.close();});
 window.addEventListener('resize',()=>{if(openControl)openControl.close();});
 window.addEventListener('scroll',e=>{if(openControl&&!openControl.list.contains(e.target))openControl.close();},true);
 const init=()=>{scan(document);let batch=false;const observer=new MutationObserver(records=>{if(batch)return;batch=true;queueMicrotask(()=>{batch=false;for(const record of records){for(const n of record.addedNodes)scan(n);}});});observer.observe(document.body,{childList:true,subtree:true});
   const mixed=document.getElementById('pf-demo-mixed');if(mixed){mixed.indeterminate=true;mixed.addEventListener('change',()=>{mixed.indeterminate=false;});}
   const choice=document.getElementById('pf-controls-choice');if(choice)choice.addEventListener('change',()=>{const t=document.getElementById('pf-controls-current');if(t)t.textContent='Selected: '+choice.options[choice.selectedIndex].text;});
 };

})();

</script>
