[project]
name = "powerforge-document-classification"
version = "0.1.0"
description = "Document classification profile, taxonomy, prompts, and provider-neutral application helpers."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "sqlalchemy>=2.0.35",
    "celery[redis]>=5.4",
    "powerforge-document-model",
    "powerforge-ai",
    "powerforge-document-processing",
]

[project.scripts]
powerforge-backfill-classification = "powerforge_document_classification.backfill:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
powerforge_document_classification = ["prompts/*.txt"]
