[project]
name = "powerforge-shared"
version = "0.1.0"
description = "Shared configuration, logging, and identifiers for PowerForge services."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
