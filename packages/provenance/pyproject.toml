[project]
name = "powerforge-provenance"
version = "0.1.0"
description = "Evidence and provenance contracts for extracted engineering values."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
