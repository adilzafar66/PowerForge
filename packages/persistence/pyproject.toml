[project]
name = "powerforge-persistence"
version = "0.1.0"
description = "Neutral SQLAlchemy persistence mappings shared by PowerForge services."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.35",
    "powerforge-project",
    "powerforge-engineering-model",
    "powerforge-topology",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
