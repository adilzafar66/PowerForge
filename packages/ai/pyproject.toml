[project]
name = "powerforge-ai"
version = "0.1.0"
description = "AI provider interfaces. Domain packages must not import vendor SDKs."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
